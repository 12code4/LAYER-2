<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Doodle Pad</title>
<meta name="description" content="A little pad for drawing.">
<style>
  :root{ --paper:#faf6ee; --paper2:#f3eee2; --ink:#2b2822; --edge:#e5ddcc; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#14140f; --paper2:#191912; --ink:#eae6da; --edge:#26251c; }
  }
  :root[data-theme="dark"]{ --paper:#14140f; --paper2:#191912; --ink:#eae6da; --edge:#26251c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
  #pad{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
  @media (pointer:coarse){ /* touch: let the finger be the cursor */ }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<script>
"use strict";
/* =====================================================================
   Doodle Pad  (internal: NULLPAD)
   A pad for drawing. Whatever you draw is alive. It watches how you draw,
   it learns your hand, and — after a while — it begins to draw back.
   Pointer only. No text. No instructions. Pull at it.
   Built from a design spec + adversarial critique (see DESIGN in repo).
   ===================================================================== */
const cv=document.getElementById("pad"), ctx=cv.getContext("2d");
const FAST=/(?:\?|&)fast/.test(location.search);            // dev/impatient accelerator
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DPR=Math.min(2, window.devicePixelRatio||1);
let W=0,H=0;
function resize(){ W=innerWidth; H=innerHeight; cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); layoutTray(); baseDirty=true; }
addEventListener("resize",resize);

/* ---- utils --------------------------------------------------------- */
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x,y,X,Y)=>Math.hypot(x-X,y-Y);
const TAU=Math.PI*2;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function shade(hex,f){ // lighten/darken hex
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r+(f>0?(255-r)*f:r*f)),0,255); g=clamp(Math.round(g+(f>0?(255-g)*f:g*f)),0,255); b=clamp(Math.round(b+(f>0?(255-b)*f:b*f)),0,255);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---- persistent ledger (namespaced; the pad remembers) ------------- */
const KEY="doodle.v1";
let L=loadLedger();
function loadLedger(){ let s={};
  try{ s=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ s={}; }
  s.first??=Date.now(); s.visits=(s.visits||0)+1; s.timeMs??=0;
  s.drawn??=0; s.erasedAlive??=0; s.spared??=0; s.undrew??=0; s.stageMax??=1;
  s.seed??=(Math.random()*1e9|0); s.seenTurn??=false; s.color??="#2b2822";
  const prev=s.last||Date.now(); s.last=Date.now(); s.msAway=Date.now()-prev;
  return s;
}
let wiped=false;   // once the player consents to erase, the record stays gone
function saveLedger(){ if(wiped)return; try{ localStorage.setItem(KEY, JSON.stringify(L)); }catch(e){} }
let scar=null; try{ scar=JSON.parse(localStorage.getItem("doodle.scar")||"null"); }catch(e){}
let lastSave=0;

/* ---- audio (unlocked on first gesture) ----------------------------- */
let AC=null; function unlock(){ if(AC)return; try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,v,type){ if(!AC)return; try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);}catch(e){} }
const sBorn=()=>{tone(520,.09,.05,"triangle");setTimeout(()=>tone(720,.10,.05,"triangle"),70);};
const sPoke=()=>tone(360+rnd(120),.06,.05,"sine");
const sHop=()=>tone(300+rnd(80),.04,.03,"sine");
const sErase=()=>tone(180,.05,.03,"sawtooth");
const sHeart=()=>{tone(680,.12,.05,"sine");setTimeout(()=>tone(880,.14,.05,"sine"),90);};
const sChord=()=>{[262,330,392,523].forEach((f,i)=>setTimeout(()=>tone(f,1.6,.05,"sine"),i*60));};

/* ---- palette + tray ------------------------------------------------ */
const PAL=["#2b2822","#e0553f","#e6a33f","#5bb26b","#4a86c4","#8a5bc0"];
let color=L.color||PAL[0], tool="pen";
let tray={x:0,y:0,dots:[],eraser:{x:0,y:0,r:16},dogear:{x:0,y:0,s:26}};
function layoutTray(){
  const bx=26, by=H-40; tray.dots.length=0;
  for(let i=0;i<PAL.length;i++) tray.dots.push({x:bx+i*30,y:by,r:10,c:PAL[i]});
  tray.eraser.x=bx+PAL.length*30+18; tray.eraser.y=by;
  tray.dogear.x=W; tray.dogear.y=H;
}

/* ---- the world ----------------------------------------------------- */
let strokes=[];               // retained-mode marks; each may be alive
let fx=[];                    // particles / reaction icons
let nextId=1;
let pointer={x:innerWidth/2,y:innerHeight/2,px:0,py:0,down:false,type:"mouse",vx:0,vy:0,speed:0};
let drawing=null;             // current stroke buffer
let grabbed=null;             // creature being flung
let baseDirty=true;

/* view transform (for the zoom-out reveal) */
let view={s:1,ox:0,oy:0,ts:1,tox:0,toy:0};

/* ---- stroke capture ------------------------------------------------ */
function beginStroke(x,y){
  drawing={id:nextId++, author:0, color:color, raw:[x,y,widthAt(0)], lastx:x,lasty:y, lastt:performance.now()};
}
function extendStroke(x,y){
  if(!drawing)return; const t=performance.now(), dt=Math.max(1,t-drawing.lastt);
  const sp=dist(x,y,drawing.lastx,drawing.lasty)/dt;   // px/ms
  const w=widthAt(sp)*(pointer.type==="pen"&&pointer.pressure?clamp(pointer.pressure*1.6,.4,1.6):1);
  drawing.raw.push(x,y,w); drawing.lastx=x;drawing.lasty=y;drawing.lastt=t;
}
function widthAt(sp){ return clamp(11 - sp*10, 2.2, 12); }   // slow=fat, fast=thin
function endStroke(){
  if(!drawing)return; const raw=drawing.raw;
  if(raw.length<6){ // a tap, not a stroke -> seed a tiny dot creature at the point
    seedDot(raw[0],raw[1]); drawing=null; return;
  }
  const s=makeStroke(resample(raw,3), drawing.color, 0);
  strokes.push(s); L.drawn++; grow(1.0); comeAlive(s, strokes.length===1||L.drawn<=1?true:undefined);
  drawing=null; saveLedger();
}
function resample(raw,spacing){
  const pts=[]; let px=raw[0],py=raw[1],pw=raw[2]; pts.push(px,py,pw); let acc=0;
  for(let i=3;i<raw.length;i+=3){ let x=raw[i],y=raw[i+1],w=raw[i+2]; let d=dist(px,py,x,y);
    while(acc+d>=spacing){ const t=(spacing-acc)/d; px=lerp(px,x,t);py=lerp(py,y,t);pw=lerp(pw,w,t); pts.push(px,py,pw); d=dist(px,py,x,y); acc=0; }
    acc+=d; px=x;py=y;pw=w;
  }
  pts.push(raw[raw.length-3],raw[raw.length-2],raw[raw.length-1]);
  return new Float32Array(pts);
}

/* ---- ink rendering (variable width capsule stamping) --------------- */
function inkPath(g,pts,ox,oy){
  for(let i=0;i<pts.length-3;i+=3){
    const x1=pts[i]-ox,y1=pts[i+1]-oy,w1=pts[i+2], x2=pts[i+3]-ox,y2=pts[i+4]-oy,w2=pts[i+5];
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1, nx=-dy/len*0.5, ny=dx/len*0.5;
    g.beginPath();
    g.moveTo(x1+nx*w1,y1+ny*w1); g.lineTo(x2+nx*w2,y2+ny*w2);
    g.lineTo(x2-nx*w2,y2-ny*w2); g.lineTo(x1-nx*w1,y1-ny*w1); g.closePath(); g.fill();
    g.beginPath(); g.arc(x2,y2,w2*0.5,0,TAU); g.fill();
  }
  g.beginPath(); g.arc(pts[0]-ox,pts[1]-oy,pts[2]*0.5,0,TAU); g.fill();
}

/* ---- make a stroke object (+bake sprite, classify) ----------------- */
function bbox(pts){ let a=1e9,b=1e9,c=-1e9,d=-1e9,mw=0; for(let i=0;i<pts.length;i+=3){a=Math.min(a,pts[i]);c=Math.max(c,pts[i]);b=Math.min(b,pts[i+1]);d=Math.max(d,pts[i+1]);mw=Math.max(mw,pts[i+2]);} return {x:a,y:b,w:c-a,h:d-b,mw}; }
function makeStroke(pts,col,author){
  const bb=bbox(pts), pad=Math.ceil(bb.mw)+6;
  const spr=document.createElement("canvas"); spr.width=Math.max(2,Math.ceil((bb.w+pad*2)*DPR)); spr.height=Math.max(2,Math.ceil((bb.h+pad*2)*DPR));
  const sg=spr.getContext("2d"); sg.setTransform(DPR,0,0,DPR,0,0); sg.fillStyle=col;
  const ox=bb.x-pad, oy=bb.y-pad; inkPath(sg,pts,ox,oy);
  const closed=dist(pts[0],pts[1],pts[pts.length-3],pts[pts.length-2])< Math.max(18,bb.mw*2) && (bb.w+bb.h)>40;
  let kind="worm"; const span=bb.w+bb.h;
  if(span<26) kind="dot"; else if(closed) kind="blob"; else if(pts.length>90 && bb.w<span*0.7) kind="fuzz"; else kind="worm";
  return { id:author?nextId++:drawing.id, author, pts, color:col, bb, sprW:bb.w+pad*2, sprH:bb.h+pad*2, spr, ox, oy,
    hx:bb.x, hy:bb.y, x:bb.x, y:bb.y, vx:0,vy:0, rot:0, scale:1, sq:0, closed, kind,
    alive:false, soul:null, born:performance.now(), phase:rnd(0,TAU), settled:true, growT:1 };
}

/* ---- give a stroke a soul (eyes) ----------------------------------- */
function comeAlive(s,hero){
  s.alive=true; s.settled=false; s.soul={ state:"idle", blink:rnd(2,5), mood:0, wob:rnd(0,TAU), breathe:rnd(0,TAU),
    eyes:eyePlaces(s), pupils:[{x:0,y:0,vx:0,vy:0},{x:0,y:0,vx:0,vy:0}], flee:0, spared:false, tmr:0, temper:temperFor(s.color) };
  s.floor=jarFloor();
  if(hero){ s.hero=true; s.vy=-3; s.sq=.5; } // first breath: guaranteed adorable
  sBorn(); reactAt(s,"born");
}
function temperFor(c){ if(c==="#e0553f")return "hot"; if(c==="#4a86c4")return "sleepy"; if(c==="#5bb26b")return "social"; if(c==="#e6a33f")return "bouncy"; return "plain"; }
function eyePlaces(s){
  const cx=(s.bb.w)/2, top=s.bb.h*0.3; const r=clamp(Math.min(s.bb.w,s.bb.h)*0.18,4,11);
  if(s.kind==="dot") return [{ox:s.bb.w/2,oy:s.bb.h/2,r:clamp(s.bb.w*0.5,5,10)}];
  if(s.kind==="worm"){ return [{ox:s.bb.w*0.12,oy:top,r}]; } // head end
  return [{ox:cx-r*1.4,oy:top,r},{ox:cx+r*1.4,oy:top,r}];
}
function jarFloor(){ return H-70; }
function seedDot(x,y){ const pts=new Float32Array([x-4,y,6, x,y,7, x+4,y,6]); const s=makeStroke(pts,color,1); s.id=nextId++; strokes.push(s); comeAlive(s); grow(.3); }

/* ---- reaction FX (wordless) ---------------------------------------- */
function reactAt(s,kind){
  const cx=s.x+s.bb.w/2, cy=s.y-6;
  const map={heart:"♥",spark:"✦",note:"♪",q:"?",ex:"!",z:"z",dust:"·"};
  if(kind==="dust"){ for(let i=0;i<6;i++)fx.push({x:cx+rnd(-8,8),y:s.y+s.bb.h/2,vx:rnd(-1,1),vy:rnd(-1.5,-.3),life:1,g:.05,txt:"·",c:s.color,sz:12}); return; }
  const c={heart:"#dd6b8a",ex:"#e0553f",q:"#4a86c4",note:"#8a5bc0",z:"#9a978c",spark:"#e6a33f"}[kind]||"#9a978c";
  for(let i=0;i<(kind==="heart"?3:2);i++) fx.push({x:cx+rnd(-10,10),y:cy,vx:rnd(-.4,.4),vy:rnd(-1.4,-.7),life:1,g:.02,txt:map[kind]||"·",c,sz:kind==="ex"?20:16});
  if(kind==="heart")sHeart();
}

/* ===================================================================
   THE DIRECTOR — one agency scalar + ledger triggers.
   Stages: 1 toy · 2 will(flee) · 3 pad draws back · 4 mimic ·
           5 other hand · 6 inversion · 7 finale/endings
   =================================================================== */
let stage=1;   // always start at the toy; memory shows through behaviour, not by skipping the joy
let agency=0, T=0, sinceInput=0, sinceIdleDraw=0, lull=false;
const K=FAST?7:1;                            // accelerator
function grow(n){ agency=clamp(agency+n*0.01*K,0,1); }
let director={otherCursor:null, invertT:0, finale:null, offered:false, ending:"", holdT:0, holdMoved:0, consent:false, mergeT:0, giant:null, sinceOffer:0};

function directorTick(dt){
  T+=dt; L.timeMs+=dt*1000;
  // advance stages by action + soft time floors (so any play style progresses)
  const t=T;
  if(stage<2 && L.drawn>=3 && t>(FAST?6:45)) enterStage(2);
  if(stage<3 && L.drawn>=6 && t>(FAST?12:75) && lull) padDrawsBack();
  if(stage>=3 && stage<4 && L.undrew>=2 && lastPlayerShape) triggerMimic();
  if(stage>=4 && stage<5 && (t>(FAST?30:240) || L.undrew>=4)) enterOtherHand();
  if(stage>=5 && stage<6 && (t>(FAST?45:360) || director.otherHandActs>=3 || nearPadEdge())) beginInversion();
  // occasional pad activity once awake
  if(stage>=3 && lull && Math.random()<0.006*K && strokes.filter(s=>s.alive).length<40) padDrawsBack(true);
  if(stage>=3) maybeSweetGesture();
}
function enterStage(n){ if(stage>=n)return; stage=n; L.stageMax=Math.max(L.stageMax,n); saveLedger(); }

/* Stage 3 — the pad draws back (autodraw a stroke point by point) */
let lastPlayerShape=null;
function padDrawsBack(minor){
  enterStage(3);
  const near = strokes.find(s=>s.alive) || {x:W/2,y:H/2,bb:{w:0,h:0}};
  const ax=clamp((near.x||W/2)+rnd(-120,120),60,W-60), ay=clamp((near.y||H/2)+rnd(-60,60),80,jarFloor()-20);
  const pts=genPadStroke(ax,ay, minor?0.6:1);
  const s=makeStroke(pts, color, 1);
  s.growT=0; s.settled=false; s.alive=false; s.pending=true;
  strokes.push(s); L.undrew++; saveLedger();
}
function genPadStroke(cx,cy,scale){
  // a small hand-drawn-looking blob/loop in the player's palette
  const n=6+(Math.random()*4|0), rad=rnd(16,34)*scale, out=[];
  const cpts=[]; for(let i=0;i<=n;i++){ const a=i/n*TAU; const rr=rad*(0.7+Math.random()*0.5); cpts.push(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.85); }
  // catmull-rom sample
  for(let i=0;i<cpts.length/2-1;i++){
    const p0=vp(cpts,i-1),p1=vp(cpts,i),p2=vp(cpts,i+1),p3=vp(cpts,i+2);
    for(let t=0;t<1;t+=0.2){ const tt=t*t,ttt=tt*t;
      const x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*tt+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*ttt);
      const y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*tt+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*ttt);
      out.push(x+rnd(-.6,.6), y+rnd(-.6,.6), rnd(4,8));
    }
  }
  return resample(new Float32Array(out),3);
}
function vp(a,i){ i=clamp(i,0,a.length/2-1); return [a[i*2],a[i*2+1]]; }

/* Stage 3.5 — a sweet unprompted mark: a heart above a creature */
let sweetDone=0;
function maybeSweetGesture(){
  if(sweetDone>=2 || Math.random()>0.004*K) return;
  const cands=strokes.filter(s=>s.alive && !s.hero); if(cands.length<1)return;
  const s=pick(cands); reactAt(s,"heart"); sweetDone++;
  for(let i=0;i<4;i++)fx.push({x:s.x+s.bb.w/2+rnd(-6,6),y:s.y-10,vx:rnd(-.3,.3),vy:rnd(-1.2,-.6),life:1.4,g:.01,txt:"♥",c:"#dd6b8a",sz:16});
}

/* Stage 4 — a creature mimics your last shape, slightly wrong */
function triggerMimic(){
  enterStage(4);
  if(!lastPlayerShape) return;
  const watcher=strokes.find(s=>s.alive); if(!watcher)return;
  const ax=clamp(watcher.x+rnd(40,90),60,W-80), ay=clamp(watcher.y,80,jarFloor()-20);
  const pts=warpShape(lastPlayerShape, ax, ay);
  const s=makeStroke(pts, color, 1); s.growT=0; s.settled=false; s.alive=false; s.pending=true; s.mimic=true;
  strokes.push(s); L.undrew++; reactAt(watcher,"note");
  lastPlayerShape=null;
}
function warpShape(src,cx,cy){
  const bb=bbox(src); const sx=cx-bb.x-bb.w/2, sy=cy-bb.y-bb.h/2; const out=[];
  for(let i=0;i<src.length;i+=3){ out.push(src[i]+sx+rnd(-4,4), src[i+1]+sy+rnd(-4,4), src[i+2]*rnd(.8,1.1)); }
  return resample(new Float32Array(out),3);
}

/* Stage 5 — the other hand (a second, heavier author) */
function enterOtherHand(){
  enterStage(5);
  director.otherCursor={x:W-60,y:60,tx:W/2,ty:H/2,active:true}; director.otherHandActs=0;
}
function otherHandTick(dt){
  const oc=director.otherCursor; if(!oc)return;
  // drift toward a target; occasionally redraw an erased spot or draw on your side
  oc.x=lerp(oc.x,oc.tx,0.03); oc.y=lerp(oc.y,oc.ty,0.03);
  if(dist(oc.x,oc.y,oc.tx,oc.ty)<12 && Math.random()<0.02*K){
    oc.tx=rnd(80,W-80); oc.ty=rnd(90,jarFloor()-30);
    if(Math.random()<0.6){ const pts=genPadStroke(oc.x,oc.y,1.1); const s=makeStroke(pts,pick(["#7a6f5c","#5a5346"]),1); s.growT=0;s.settled=false;s.alive=false;s.pending=true; s.heavy=true; strokes.push(s); director.otherHandActs++; }
    else ablate();
  }
}
let ablations=0;
function ablate(){ // gentle, always restored — never a fake crash
  if(ablations>3)return; ablations++;
  const kind=pick(["desat","tidy"]);
  if(kind==="desat"){ document.documentElement.style.filter="saturate(.5)"; setTimeout(()=>document.documentElement.style.filter="",1600); }
  else { const a=strokes.find(s=>s.author===0 && s.alive); if(a){ a.tidied=true; setTimeout(()=>a.tidied=false,1800);} }
}

/* Stage 6 — the inversion: zoom out; you are a mark too */
let backdrop=null;
function beginInversion(){
  enterStage(6); L.seenTurn=true; saveLedger();
  buildBackdrop();
  view.ts=RM?0.5:0.14; view.tox=W*0.5-(W*0.5)*view.ts; view.toy=H*0.5-(H*0.5)*view.ts;
  director.invertT=0;
  director.giant={x:W*0.5,y:-200,ty:H*0.3};
}
function buildBackdrop(){
  backdrop=document.createElement("canvas"); backdrop.width=Math.floor(W*DPR); backdrop.height=Math.floor(H*DPR);
  const bg=backdrop.getContext("2d"); bg.setTransform(DPR,0,0,DPR,0,0);
  bg.fillStyle=css("--paper2"); bg.fillRect(0,0,W,H);
  // scatter faint doodle-ish marks: a vast pad of other small pads
  bg.globalAlpha=0.5;
  for(let i=0;i<220;i++){ const x=rnd(0,W),y=rnd(0,H),r=rnd(4,16); bg.strokeStyle=css("--edge"); bg.lineWidth=1.5;
    bg.beginPath(); const seg=3+(Math.random()*4|0); bg.moveTo(x,y);
    for(let j=0;j<seg;j++) bg.lineTo(x+rnd(-r,r),y+rnd(-r,r)); bg.stroke();
    if(Math.random()<0.3){ bg.fillStyle=css("--edge"); bg.fillRect(x-1,y-1,2,2); }
  }
  bg.globalAlpha=1;
}

/* ---- endings ------------------------------------------------------- */
function offerFinale(){
  if(director.offered)return; director.offered=true;
  // the giant hand stops descending and sets its eraser down beside your mark — an offer, not a threat
  if(director.giant) director.giant.ty=director.giant.y;
  director.finale={eraser:{x:clamp(pointer.x+70,60,W-60), y:clamp(pointer.y,80,H-90)}, merged:0};
}
function tryEnd(){
  if(ending) return;
  const cruel = L.erasedAlive>=5;
  // Ending A: hold still / let critters gather (low cruelty). Detect: pointer near-idle 5s while creatures cluster to cursor.
  // Ending B: slow hold-drag with the offered eraser (>=2s held while moving).
}
let ending="";
function doMerge(){ if(ending)return; ending="merge"; director.mergeT=0; if(director.giant)director.giant.ty=director.giant.y; sChord();
  for(const s of strokes){ if(s.alive&&s.soul) s.soul.state="merge"; }
}
function doErase(waved){ if(ending)return; ending="erase";
  // real, consensual: clear the game's own memory
  wiped=true; try{ localStorage.removeItem(KEY); }catch(e){}
  try{ localStorage.setItem("doodle.scar",JSON.stringify({left:Date.now(),drawn:L.drawn})); }catch(e){}
  // each turns to you and gives a little farewell hop, then dissolves
  let i=0; for(const s of strokes){ if(s.alive){ s.wave=waved?1:0; if(waved){ s.vy=-3.2-((i++)%3); s.sq=0.4; reactAt(s,waved?"heart":"dust"); } setTimeout(()=>{ s.dissolve=0.001; }, waved? 700+ (i*40):0); } }
  sChord();
}
let fxMsgTimer=0;

/* ===================================================================
   SIMULATION
   =================================================================== */
function nearPadEdge(){ return pointer.x<24||pointer.x>W-24||pointer.y<24||pointer.y>H-24; }
function awakeCount(){ let n=0; for(const s of strokes) if(s.alive&&!s.settled&&s.soul&&s.soul.state!=="sleep")n++; return n; }

function step(dt){
  directorTick(dt);
  if(stage>=5) otherHandTick(dt);
  // view lerp
  view.s=lerp(view.s,view.ts,0.02); view.ox=lerp(view.ox,view.tox,0.02); view.oy=lerp(view.oy,view.toy,0.02);
  if(stage===6){ director.invertT+=dt; if(director.offered) director.sinceOffer+=dt; if(director.giant){ director.giant.y=lerp(director.giant.y,director.giant.ty,0.012); if(director.invertT>4) offerFinale(); }
    // player's cursor becomes a mark: gains eyes/shadow (handled in render)
  }
  // pointer velocity + idle/lull
  pointer.vx=pointer.x-pointer.px; pointer.vy=pointer.y-pointer.py; pointer.speed=Math.hypot(pointer.vx,pointer.vy);
  pointer.px=pointer.x; pointer.py=pointer.y;
  if(pointer.down||pointer.speed>1.2){ sinceInput=0; lull=false; } else { sinceInput+=dt; if(sinceInput>(FAST?1.4:3.5)) lull=true; }

  const awakeCap=36;
  let awake=0;
  for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i];
    // grow (pad drawing itself in)
    if(s.pending){ s.growT=clamp(s.growT+dt*1.2,0,1); if(s.growT>=1){ s.pending=false; comeAlive(s); if(s.mimic)reactAt(s,"spark"); }
      continue; }
    if(!s.alive){ continue; }
    // dissolve on erase-ending
    if(s.dissolve!==undefined){ s.dissolve+=dt*0.6; if(s.dissolve>1){ strokes.splice(i,1); } continue; }
    const so=s.soul; if(!so) continue;
    // sleep governor
    const faraway=false;
    if(so.state!=="sleep"){ awake++; if(awake>awakeCap){ so.state="sleep"; } }
    // physics
    const cx=s.x+s.bb.w/2, cy=s.y+s.bb.h/2;
    if(s!==grabbed && so.state!=="sleep"){
      s.vy+=0.28*dt*60/60; // gravity
      // flee the eraser (stage>=2)
      if(stage>=2 && tool==="eraser" && pointer.down){ const d=dist(pointer.x,pointer.y,cx,cy);
        if(d<150){ so.state="flee"; so.flee=1; const a=Math.atan2(cy-pointer.y,cx-pointer.x); s.vx+=Math.cos(a)*0.9; s.vy+=Math.sin(a)*0.6-0.2; if(Math.random()<0.02)reactAt(s,"ex"); }
      } else if(so.state==="flee" && so.flee>0){ so.flee-=dt; if(so.flee<=0){ so.state="idle"; } }
      // merge finale: ease toward your mark
      if(so.state==="merge"){ s.vx+=Math.sign(pointer.x-cx)*0.06; if(cy>pointer.y+4)s.vy-=0.16; }
      // curiosity: drift toward cursor on lull (ducklings)
      if((so.state==="idle"||so.state==="curious") && !nearPadEdge()){
        const d=dist(pointer.x,pointer.y,cx,cy);
        if(d<260 && d>40 && (so.temper==="social"||so.spared||lull||Math.random()<0.3)){ so.state="curious"; s.vx+=Math.sign(pointer.x-cx)*0.08; if(cy>pointer.y+10)s.vy-=0.12; }
        else if(so.state==="curious"&&d>320) so.state="idle";
      }
      // temperament flavour
      if(so.temper==="bouncy" && Math.abs(s.vy)<0.4 && Math.random()<0.02){ s.vy=-3.4; sHop(); }
      s.vx*=0.96; s.x+=s.vx; s.y+=s.vy;
      // floor bounce
      const fl=jarFloor()-s.bb.h*0.5;
      if(s.y> fl){ s.y=fl; if(s.vy>1.2){ s.sq=Math.min(1,s.vy*0.08); sHop(); } s.vy*=-0.42; s.vx*=0.86; }
      // walls
      if(s.x<6){s.x=6;s.vx=Math.abs(s.vx)*0.5;} if(s.x>W-s.bb.w-6){s.x=W-s.bb.w-6;s.vx=-Math.abs(s.vx)*0.5;}
      if(s.y<40){s.y=40;s.vy=Math.abs(s.vy)*0.4;}
    }
    // soul animation
    so.wob+=dt*(RM?1.2:2.4); so.breathe+=dt*1.6; so.blink-=dt; if(so.blink<-0.12)so.blink=rnd(2.5,6);
    s.sq*=0.86;
    if(s.dizzy>0){ s.dizzy-=dt; s.rot+=0.5; } else if(s.rot){ s.rot*=0.85; if(Math.abs(s.rot)<0.01)s.rot=0; }
    // pupils spring to cursor, shoved by body accel
    let gx=pointer.x, gy=pointer.y;
    if(so.state==="merge" && director.giant){ gx=director.giant.x; gy=director.giant.y; }  // at the merge, all eyes turn outward
    for(let e=0;e<so.eyes.length;e++){ const p=so.pupils[e]; const eye=so.eyes[e];
      const ex=s.x+eye.ox, ey=s.y+eye.oy; let tx=(gx-ex), ty=(gy-ey); const el=Math.hypot(tx,ty)||1; const mr=eye.r*0.45;
      tx=tx/el*mr - s.vx*0.6; ty=ty/el*mr - s.vy*0.6;
      p.vx+=(tx-p.x)*0.2; p.vy+=(ty-p.y)*0.2; p.vx*=0.7; p.vy*=0.7; p.x+=p.vx; p.y+=p.vy;
    }
    // idle -> sleep zzz (perf + life)
    if(so.state==="idle" && Math.abs(s.vx)<0.15 && Math.abs(s.y-(jarFloor()-s.bb.h*0.5))<3){ so.tmr+=dt; if(so.tmr>(FAST?4:10)){ so.state="sleep"; reactAt(s,"z"); } } else so.tmr=0;
    if(so.state==="sleep" && (pointer.speed>4 && dist(pointer.x,pointer.y,cx,cy)<120)){ so.state="idle"; so.tmr=0; }
  }
  // gentle separation so creatures spread out instead of piling into a column
  const aw=[]; for(const s of strokes){ if(s.alive&&s.soul&&s.soul.state!=="sleep"&&s!==grabbed&&s.dissolve===undefined&&!s.pending) aw.push(s); }
  for(let i=0;i<aw.length;i++){ const a=aw[i], ax=a.x+a.bb.w/2, ay=a.y+a.bb.h/2, ar=Math.max(a.bb.w,a.bb.h)*0.4+7;
    for(let j=i+1;j<aw.length;j++){ const b=aw[j], bx=b.x+b.bb.w/2, by=b.y+b.bb.h/2, br=Math.max(b.bb.w,b.bb.h)*0.4+7;
      let dx=ax-bx, dy=ay-by, d=Math.hypot(dx,dy)||0.01, min=ar+br;
      if(d<min){ const push=(min-d)/min*0.5; dx/=d; dy/=d; a.vx+=dx*push; a.vy+=dy*push*0.5; b.vx-=dx*push; b.vy-=dy*push*0.5; } } }
  // merge finale: creatures gather warmly to your mark, hearts rise
  if(ending==="merge"){ director.mergeT+=dt; if(Math.random()<0.12){ const c=strokes.filter(x=>x.alive); if(c.length) reactAt(pick(c),"heart"); } }
  // particles
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=dt*0.9; if(p.life<=0)fx.splice(i,1); }
  if(fx.length>200)fx.splice(0,fx.length-200);
  // bait blob early self-demo (stage1): a resting critter toddles to cursor
  baitTick(dt);
  // finale ending detection
  finaleDetect(dt);
  if(fxMsgTimer>0)fxMsgTimer-=dt;
  if(performance.now()-lastSave>2000){ lastSave=performance.now(); saveLedger(); }
}

/* bait: on load, one wandering blob demonstrates aliveness with no text */
let bait=null;
function baitTick(dt){
  if(stage>1)return;
  if(!bait && L.drawn===0 && strokes.length===0){ // create a resting demo doodle
    const cx=W/2,cy=H/2; const pts=genPadStroke(cx,cy,1); bait=makeStroke(pts, css("--ink"), 1); bait.id=nextId++; strokes.push(bait); comeAlive(bait); bait.soul.temper="social"; }
  if(bait && L.drawn>0){ bait=null; } // once the player draws, stop babysitting
}

/* finale endings: A merge (idle+low cruelty), B consensual erase (hold-drag) */
function finaleDetect(dt){
  if(stage<6 || !director.offered || ending) return;
  const cruel=L.erasedAlive>=5;
  // B: the consent gesture — pick up the offered eraser, then a slow deliberate hold-drag (>=2s).
  //    Only counts once the eraser is actually in hand (director.consent), so it can never be an accident.
  if(pointer.down && director.consent){ director.holdT+=dt; director.holdMoved+=pointer.speed;
    if(director.holdT>2 && director.holdMoved>120){ doErase(!cruel); }
  } else { director.holdT=0; director.holdMoved=0; }
  // A: do nothing — hold still and let them gather to you (gentle player only).
  //    Give a real window after the offer, and never merge while they're reaching for the eraser.
  if(!cruel && !director.consent && director.sinceOffer>(FAST?4:8) && sinceInput>(FAST?3:6)){
    const nearErase = director.finale && dist(pointer.x,pointer.y,director.finale.eraser.x,director.finale.eraser.y)<90;
    const near = strokes.filter(s=>s.alive && dist(s.x+s.bb.w/2,s.y+s.bb.h/2,pointer.x,pointer.y)<170).length;
    if(near>=2 && !nearErase) doMerge();
  }
}

/* ===================================================================
   RENDER
   =================================================================== */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // backdrop (inversion)
  if(backdrop){ ctx.globalAlpha=clamp((0.14-view.s)/0.14*0+ (1-view.s)*1.1,0,1); ctx.drawImage(backdrop,0,0,W,H); ctx.globalAlpha=1; }
  else { ctx.fillStyle=css("--paper"); ctx.fillRect(0,0,W,H); }
  ctx.save();
  ctx.translate(view.ox,view.oy); ctx.scale(view.s,view.s);
  // the pad's own sheet (so the zoom-out shows it as one small sheet)
  if(view.s<0.98){ ctx.fillStyle=css("--paper"); ctx.strokeStyle=css("--edge"); ctx.lineWidth=2/view.s; roundRect(0,0,W,H,10); ctx.fill(); ctx.stroke(); }
  // strokes
  for(const s of strokes) drawStroke(s);
  // erased-ghost handled inline
  ctx.restore();
  // giant cursor (inversion)
  if(director.giant){ drawGiantCursor(director.giant.x,director.giant.y); }
  // other-hand cursor
  if(director.otherCursor&&director.otherCursor.active) drawNib(director.otherCursor.x,director.otherCursor.y,"#5a5346",1.6);
  // tray
  drawTray();
  // particles
  for(const p of fx){ ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.c; ctx.font=`${p.sz}px ui-monospace,monospace`; ctx.textAlign="center"; ctx.fillText(p.txt,p.x,p.y); }
  ctx.globalAlpha=1;
  // finale eraser offered
  if(director.finale&&director.finale.eraser&&!ending){ const e=director.finale.eraser; ctx.fillStyle="#e4b8c4"; roundRect(e.x-16,e.y-11,32,22,8); ctx.fill(); ctx.strokeStyle="#c99aa8"; ctx.stroke(); }
  // player's drawn cursor (unless touch)
  if(pointer.type!=="touch"){
    if(stage>=6 && director.invertT>1) drawSelfMark(pointer.x,pointer.y); // you are ink now
    else if(tool==="eraser") drawEraser(pointer.x,pointer.y);
    else drawNib(pointer.x,pointer.y,color,1);
  }
  // ending overlays
  if(ending==="erase" && strokes.every(s=>!s.alive)) drawGone();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawStroke(s){
  if(s.pending){ // the pad drawing itself in, point by point
    const k=Math.max(2,Math.floor((s.pts.length/3)*s.growT))*3;
    inkPathAbs(s.pts.subarray(0,k), s.color); return;
  }
  const so=s.soul, bw=s.bb.w, bh=s.bb.h, pad=(s.sprW-bw)/2;
  ctx.save();
  ctx.translate(s.x+bw/2, s.y+bh/2);
  let alpha=1;
  if(s.dissolve!==undefined) alpha=clamp(1-s.dissolve,0,1);
  if(s.tidied) alpha*=0.9;
  ctx.globalAlpha=alpha;
  // fake-3D floor shadow (alive only)
  if(s.alive){ ctx.save(); ctx.globalAlpha=alpha*0.13; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(0,bh/2+6,bw*0.42,5,0,0,TAU); ctx.fill(); ctx.restore(); }
  const sq=1-s.sq*0.4, st=1+s.sq*0.4;
  const wob=(s.alive&&so&&!RM)?Math.sin(so.wob)*0.03:0;
  ctx.rotate((s.rot||0)+wob); ctx.scale(st,sq);
  // the baked ink, centered
  ctx.drawImage(s.spr, -bw/2-pad, -bh/2-pad, s.sprW, s.sprH);
  // face
  if(s.alive && so){
    const asleep=so.state==="sleep", flee=so.state==="flee";
    for(let e=0;e<so.eyes.length;e++){ const eye=so.eyes[e], p=so.pupils[e]||{x:0,y:0};
      const ex=-bw/2+eye.ox, ey=-bh/2+eye.oy;
      if(asleep){ ctx.strokeStyle="#1e1e1e"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ex-eye.r*0.7,ey); ctx.lineTo(ex+eye.r*0.7,ey); ctx.stroke(); continue; }
      ctx.fillStyle="#f6f6f1"; ctx.beginPath(); ctx.arc(ex,ey,eye.r,0,TAU); ctx.fill();
      const pr=flee?eye.r*0.3:eye.r*0.42;
      ctx.fillStyle="#1c1c1c"; ctx.beginPath(); ctx.arc(ex+p.x, ey+p.y-(flee?eye.r*0.2:0), pr,0,TAU); ctx.fill();
    }
    if(!asleep){ ctx.strokeStyle="#1c1c1c"; ctx.lineWidth=Math.max(1.5,Math.min(bw,bh)*0.05);
      const mood=flee?-0.7:((so.mood||0)+(so.state==="curious"?0.35:0));
      const my=Math.min(bh,bw)*0.14, mw=Math.min(bw,bh)*0.16;
      ctx.beginPath(); ctx.moveTo(-mw,my); ctx.quadraticCurveTo(0,my+mood*mw,mw,my); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
  // sleeping zzz occasionally
  if(s.alive && so && so.state==="sleep" && Math.random()<0.004){ reactAt(s,"z"); }
}
function inkPathAbs(pts,col){ ctx.fillStyle=col; inkPath(ctx,pts,0,0); }

/* ---- cursors / faces ---------------------------------------------- */
function drawNib(x,y,col,scale){ ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(6,-16); ctx.lineTo(10,-13); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(col,0.4); ctx.fillRect(6,-30,4,16); ctx.restore(); }
function drawEraser(x,y){ ctx.save(); ctx.translate(x,y); ctx.fillStyle="#e4b8c4"; roundRect(-13,-9,26,18,6); ctx.fill(); ctx.strokeStyle="#c99aa8"; ctx.stroke(); ctx.restore(); }
function drawGiantCursor(x,y){ ctx.save(); ctx.translate(x,y); ctx.globalAlpha=0.6; ctx.fillStyle=css("--ink");
  // a soft pencil, held loosely — curious, not a blade
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(44,-118); ctx.quadraticCurveTo(60,-112,76,-100); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(css("--ink"),0.35); roundRect(44,-260,30,150,8); ctx.fill(); ctx.restore(); }
function drawSelfMark(x,y){ // your cursor, now a mark among them: shadow + tiny eyes
  ctx.save(); ctx.translate(x,y);
  ctx.globalAlpha=0.14; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(6,10,10,4,0,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  drawNib(0,0,color,1);
  const flinch = nearPadEdge()?3:0;
  ctx.fillStyle="#f4f4f0"; ctx.beginPath(); ctx.arc(8,-8+flinch,4,0,TAU); ctx.arc(15,-8+flinch,4,0,TAU); ctx.fill();
  ctx.fillStyle="#1e1e1e"; const lx=clamp((director.giant?director.giant.x-x:0)/200,-2,2);
  ctx.beginPath(); ctx.arc(8+lx,-8+flinch,1.8,0,TAU); ctx.arc(15+lx,-8+flinch,1.8,0,TAU); ctx.fill();
  ctx.restore();
}
function drawTray(){
  const trayA=clamp((view.s-0.55)/0.45,0,1); if(trayA<=0) return;   // fade out as the pad recedes
  ctx.save(); ctx.globalAlpha=trayA;
  for(const d of tray.dots){ ctx.fillStyle=d.c; ctx.beginPath(); ctx.arc(d.x,d.y,d.r*(d.c===color&&tool==="pen"?1.35:1),0,TAU); ctx.fill();
    if(d.c===color&&tool==="pen"){ ctx.strokeStyle=css("--ink"); ctx.lineWidth=1.5; ctx.stroke(); } }
  const e=tray.eraser; ctx.fillStyle="#e4b8c4"; roundRect(e.x-14,e.y-10,28,20,7); ctx.fill();
  if(tool==="eraser"){ ctx.strokeStyle=css("--ink"); ctx.lineWidth=1.5; ctx.stroke(); }
  // dog-ear (undo)
  ctx.fillStyle=css("--paper2"); ctx.strokeStyle=css("--edge"); ctx.beginPath(); ctx.moveTo(W,H-26); ctx.lineTo(W,H); ctx.lineTo(W-26,H); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawGone(){ ctx.fillStyle=css("--paper"); ctx.fillRect(0,0,W,H); }

/* ===================================================================
   POINTER
   =================================================================== */
function pos(e){ return {x:e.clientX, y:e.clientY}; }
cv.addEventListener("pointerdown",e=>{ unlock(); cv.setPointerCapture(e.pointerId); const p=pos(e);
  pointer.x=p.x;pointer.y=p.y;pointer.down=true;pointer.type=e.pointerType;pointer.pressure=e.pressure;
  sinceInput=0; lull=false;
  // finale: the pad is drawn; you can pick up the offered eraser (consent), or do nothing.
  if(stage>=6 && director.offered){ if(director.finale && dist(p.x,p.y,director.finale.eraser.x,director.finale.eraser.y)<48){ director.consent=true; } return; }
  // tray hit?
  if(hitTray(p.x,p.y)){ return; }
  // dog-ear undo
  if(p.x>W-30 && p.y>H-30){ undoLast(); return; }
  if(tool==="eraser"){ eraseAt(p.x,p.y); return; }
  // grab a creature?
  const c=creatureAt(p.x,p.y);
  if(c){ grabbed=c; c.soul&&(c.soul.state="idle"); c.grabX=p.x-c.x; c.grabY=p.y-c.y; sPoke(); return; }
  beginStroke(p.x,p.y);
});
addEventListener("pointermove",e=>{ const p=pos(e); pointer.x=p.x;pointer.y=p.y;pointer.pressure=e.pressure;
  if(!pointer.down) return;
  if(stage>=6 && director.offered) return; // finale: no drawing; your cursor is just a mark now
  if(grabbed){ const nx=p.x-grabbed.grabX, ny=p.y-grabbed.grabY; grabbed.vx=(nx-grabbed.x)*0.6; grabbed.vy=(ny-grabbed.y)*0.6; grabbed.x=nx; grabbed.y=ny; return; }
  if(tool==="eraser" && pointer.down){ eraseAt(p.x,p.y); return; }
  if(drawing){ if(getCo) for(const ev of getCo.call(e)){ extendStroke(ev.clientX,ev.clientY); } else extendStroke(p.x,p.y); }
});
addEventListener("pointerup",e=>{ pointer.down=false; director.consent=false; director.holdT=0; director.holdMoved=0;
  if(grabbed){ const sp=Math.hypot(grabbed.vx,grabbed.vy); if(sp>10){ if(grabbed.soul){grabbed.soul.state="idle"; reactAt(grabbed,"ex"); grabbed.dizzy=1;} } grabbed=null; return; }
  if(drawing){ // finalize + remember shape for the mimic
    const hadLen=drawing.raw.length; endStroke();
    const last=strokes[strokes.length-1]; if(last&&last.author===0){ lastPlayerShape=last.pts.slice(); }
  }
});
cv.addEventListener("pointercancel",()=>{ pointer.down=false; grabbed=null; drawing=null; });
const getCo = ("getCoalescedEvents" in PointerEvent.prototype) ? PointerEvent.prototype.getCoalescedEvents : null;

function hitTray(x,y){
  for(const d of tray.dots){ if(dist(x,y,d.x,d.y)<Math.max(16,d.r+6)){ color=d.c; tool="pen"; L.color=color; saveLedger(); tone(500,.05,.04,"sine"); return true; } }
  const e=tray.eraser; if(dist(x,y,e.x,e.y)<20){ tool="eraser"; tone(240,.05,.04,"sine"); return true; }
  return false;
}
function creatureAt(x,y){ let best=null,bd=1e9; for(const s of strokes){ if(!s.alive||s.pending)continue; const cx=s.x+s.bb.w/2,cy=s.y+s.bb.h/2; const r=Math.max(24,Math.max(s.bb.w,s.bb.h)*0.6); const d=dist(x,y,cx,cy); if(d<r&&d<bd){bd=d;best=s;} } return best; }
function eraseAt(x,y){
  for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; const cx=s.x+s.bb.w/2,cy=s.y+s.bb.h/2; const r=Math.max(20,Math.max(s.bb.w,s.bb.h)*0.5);
    if(dist(x,y,cx,cy)<r){
      if(s.alive && s.soul && s.soul.state==="flee"){ L.erasedAlive++; } // only fleeing-alive counts
      reactAt(s,"dust"); sErase(); strokes.splice(i,1); saveLedger(); return;
    }
  }
}
function undoLast(){ for(let i=strokes.length-1;i>=0;i--){ if(strokes[i].author===0){ reactAt(strokes[i],"dust"); strokes.splice(i,1); return; } } }

/* ===================================================================
   MAIN LOOP
   =================================================================== */
let last=performance.now(), running=true;
function loop(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  if(running){ step(dt); render(); }
  requestAnimationFrame(loop);
}

if(FAST){ window.__dbg=()=>({n:strokes.length, alive:strokes.filter(s=>s.alive).length, pending:strokes.filter(s=>s.pending).length, stage, agency:+agency.toFixed(2), drawn:L.drawn, undrew:L.undrew, erasedAlive:L.erasedAlive, tool, color, ending, view:+view.s.toFixed(2), offered:director.offered, consent:director.consent, ex:director.finale?Math.round(director.finale.eraser.x):0, ey:director.finale?Math.round(director.finale.eraser.y):0}); }
function boot(){ resize(); drawFavicon(); requestAnimationFrame(loop); saveLedger(); }
function drawFavicon(){ try{const c=document.createElement("canvas");c.width=c.height=32;const x=c.getContext("2d");
  x.fillStyle=css("--paper");x.fillRect(0,0,32,32); x.fillStyle=css("--ink"); x.beginPath();x.moveTo(8,26);x.lineTo(20,6);x.lineTo(26,10);x.closePath();x.fill();
  const l=document.createElement("link");l.rel="icon";l.href=c.toDataURL("image/png");document.head.appendChild(l);}catch(e){} }
boot();
</script>
