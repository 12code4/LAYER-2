<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Doodle Pad</title>
<meta name="description" content="A little pad for drawing.">
<style>
  :root{ --paper:#faf6ee; --paper2:#f3eee2; --ink:#2b2822; --edge:#e5ddcc; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#14140f; --paper2:#191912; --ink:#eae6da; --edge:#26251c; }
  }
  :root[data-theme="dark"]{ --paper:#14140f; --paper2:#191912; --ink:#eae6da; --edge:#26251c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
  #pad{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
  @media (pointer:coarse){ /* touch: let the finger be the cursor */ }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<script>
"use strict";
/* =====================================================================
   Doodle Pad  (internal: NULLPAD)
   A pad for drawing. Whatever you draw is alive. It watches how you draw,
   it learns your hand, and — after a while — it begins to draw back.
   Pointer only. No text. No instructions. Pull at it.
   Built from a design spec + adversarial critique (see DESIGN in repo).
   ===================================================================== */
const VERSION="4.0";                                        // polish → 3.5 · menagerie → 3.8 · sketchbook → 4.0
const cv=document.getElementById("pad"), ctx=cv.getContext("2d");
const FAST=/(?:\?|&)fast/.test(location.search);            // dev/impatient accelerator
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DPR=Math.min(2, window.devicePixelRatio||1);
let W=0,H=0;
function resize(){ W=innerWidth; H=innerHeight; cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); refreshTheme(); layoutTray(); baseDirty=true; }
addEventListener("resize",resize);

/* ---- utils --------------------------------------------------------- */
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x,y,X,Y)=>Math.hypot(x-X,y-Y);
const TAU=Math.PI*2;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
let THEME={paper:"#faf6ee",paper2:"#f3eee2",ink:"#2b2822",edge:"#e5ddcc"};
function refreshTheme(){ THEME.paper=css("--paper")||THEME.paper; THEME.paper2=css("--paper2")||THEME.paper2; THEME.ink=css("--ink")||THEME.ink; THEME.edge=css("--edge")||THEME.edge; }
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ refreshTheme(); }); }catch(e){}
function shade(hex,f){ // lighten/darken hex
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r+(f>0?(255-r)*f:r*f)),0,255); g=clamp(Math.round(g+(f>0?(255-g)*f:g*f)),0,255); b=clamp(Math.round(b+(f>0?(255-b)*f:b*f)),0,255);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---- persistent ledger (namespaced; the pad remembers) ------------- */
const KEY="doodle.v1";
let L=loadLedger();
function loadLedger(){ let s={};
  try{ s=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ s={}; }
  s.first??=Date.now(); s.visits=(s.visits||0)+1; s.timeMs??=0;
  s.drawn??=0; s.erasedAlive??=0; s.spared??=0; s.undrew??=0; s.stageMax??=1;
  s.seed??=(Math.random()*1e9|0); s.seenTurn??=false; s.color??="#2b2822";
  const prev=s.last||Date.now(); s.last=Date.now(); s.msAway=Date.now()-prev;
  return s;
}
let wiped=false;   // once the player consents to erase, the record stays gone
function saveLedger(){ if(wiped)return; try{ localStorage.setItem(KEY, JSON.stringify(L)); }catch(e){} }
let scar=null; try{ scar=JSON.parse(localStorage.getItem("doodle.scar")||"null"); }catch(e){}
let lastSave=0;

/* ---- sketchbook (Update 2): the pad keeps your drawings across sessions.
   localStorage (synchronous, so the `wiped` guard fully protects it). Only
   your own marks + your creatures' babies persist — never pad-authored
   mystery marks (that would fabricate the reveal before it's earned). */
let book=[];   // pages of serialized strokes; book[page] is stale while that page is live
function persistable(s){ return !s.pending && s.dissolve===undefined && (s.author===0 || s.baby); }
function serializeStroke(s){ const p=new Array(s.pts.length); for(let i=0;i<s.pts.length;i++) p[i]=Math.round(s.pts[i]); return {p, c:s.color, k:s.kind, b:s.baby?1:0}; }
function currentPageData(){ return strokes.filter(persistable).slice(-100).map(serializeStroke); }
function saveBook(){ if(wiped)return; try{ book[page]=currentPageData(); if(book.length>8) book=book.slice(-8);
  localStorage.setItem("doodle.book", JSON.stringify({v:1, ref:Math.min(W,H), cur:clamp(page,0,book.length-1), pages:book})); }catch(e){} }
function hydratePage(arr, ref){ if(!arr) return; const sc=Math.min(W,H)/(ref||Math.min(W,H));   // uniform scale by min-dimension (no aspect distortion)
  for(const d of arr){ if(!d||!d.p) continue; const pts=new Float32Array(d.p.length); for(let i=0;i<d.p.length;i++) pts[i]=d.p[i]*sc;
    try{ const s=makeStroke(pts, d.c||"#2b2822", 0, nextId++); s.baby=!!d.b; strokes.push(s); comeAlive(s); s.soul.state="sleep"; }catch(e){} } }
function loadBook(){ try{ const bk=JSON.parse(localStorage.getItem("doodle.book")||"null"); if(bk&&bk.pages&&bk.pages.length){ book=bk.pages; page=clamp(bk.cur||0,0,book.length-1); hydratePage(book[page], bk.ref); return true; } }catch(e){} return false; }
function turnPage(dir){ if(stage>=6) return; saveBook();
  strokes.length=0; foods.length=0; fx.length=0; grabbed=null; drawing=null; bait=null;
  let np=page+dir; if(np<0)np=0; if(np>=book.length){ book.push([]); np=book.length-1; }
  page=np; hydratePage(book[page], Math.min(W,H)); corner=null; tone(300,.08,.04,"sine"); saveBook();
}

/* ---- audio: a small generative voice for a living pad --------------
   One master bus (limiter) so nothing bypasses mute/limiting. Every pitched
   sound is quantized to one pentatonic scale, so a whole flock can never clash.
   Sine/triangle for anything alive; the eraser is the one harsh timbre. */
let AC=null, master=null, busV=null, busUI=null, busAmb=null, conv=null, ambOn=false;
let muted=!!L.muted, voices=0, lastVoiceT=0; const MAXV=6;
const SCALE=(()=>{ const t=[]; for(let o=0;o<3;o++) for(const f of [220,262,294,330,392]) t.push(f*Math.pow(2,o)); return t; })(); // A-minor-pentatonic-ish ×3 oct
function degree(i){ return SCALE[clamp(i|0,0,SCALE.length-1)]; }
function pitchOffset(t){ return t==="hot"?2 : t==="sleepy"?-3 : t==="bouncy"?1 : 0; }
function makeIR(sec,decay){ const len=(AC.sampleRate*sec)|0, buf=AC.createBuffer(2,len,AC.sampleRate); for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
function unlock(){
  if(AC){ if(AC.state==="suspended"){ try{AC.resume();}catch(e){} } return; }
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:(RM?0.32:0.5);
    const lim=AC.createDynamicsCompressor(); lim.threshold.value=-10; lim.ratio.value=12; lim.attack.value=.003; lim.release.value=.18;
    master.connect(lim); lim.connect(AC.destination);
    busV=AC.createGain(); busUI=AC.createGain(); busAmb=AC.createGain(); busAmb.gain.value=0;
    busV.connect(master); busUI.connect(master); busAmb.connect(master);
    try{ conv=AC.createConvolver(); conv.buffer=makeIR(1.1,3.0); const cg=AC.createGain(); cg.gain.value=0.16; conv.connect(cg); cg.connect(master); }catch(e){ conv=null; }
    if(!RM) startAmbient();
  }catch(e){}
}
function busOf(n){ return n==="ui"?busUI : n==="amb"?busAmb : busV; }
function voice(freq,dur,vel,type,pan,busName){
  if(!AC||muted) return;
  const now=AC.currentTime;
  if(busName!=="ui"){ if(voices>=MAXV) return; if(now-lastVoiceT<0.025) return; lastVoiceT=now; }
  try{
    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq*0.94, now); o.frequency.exponentialRampToValueAtTime(freq, now+0.03);
    lp.type="lowpass"; lp.frequency.setValueAtTime(3200, now); lp.frequency.exponentialRampToValueAtTime(700, now+dur);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(Math.max(0.0015,0.09*(vel||1)), now+0.012); g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(lp); lp.connect(g);
    let out=g;
    if(AC.createStereoPanner){ const pn=AC.createStereoPanner(); pn.pan.value=clamp(pan||0,-1,1); g.connect(pn); out=pn; }
    out.connect(busOf(busName)); if(conv && busName!=="ui") out.connect(conv);
    voices++; o.onended=()=>{ voices=Math.max(0,voices-1); }; o.start(now); o.stop(now+dur+0.02);
  }catch(e){}
}
// shared primitive kept for the tray etc. — now routed through the master bus (mute/limiter apply)
function tone(f,d,v,type){ voice(f,d,(v||.05)/0.09,type,0,"ui"); }
function startAmbient(){ if(ambOn||!AC||RM) return; ambOn=true; try{
  for(const [d,det] of [[2,-4],[4,5]]){ const o=AC.createOscillator(),g=AC.createGain(); o.type="sine"; o.frequency.value=degree(d); o.detune.value=det; g.gain.value=0.5; o.connect(g); g.connect(busAmb); o.start(); }
  busAmb.gain.setTargetAtTime(0.016, AC.currentTime, 3);   // swells in, never snaps
}catch(e){} }
function toggleMute(){ muted=!muted; L.muted=muted; saveLedger(); if(master) master.gain.setTargetAtTime(muted?0:(RM?0.32:0.5), AC.currentTime, 0.05); if(!muted) voice(degree(9),0.12,1,"sine",0); trayFlash=0.9; }
let trayFlash=0;
const sBorn=(s)=>{ const p=s&&s.soul?s.soul.pitch:8, pn=s&&s.soul?s.soul.pan:0; voice(degree(p),0.14,1,"triangle",pn); setTimeout(()=>voice(degree(p+2),0.16,1,"triangle",pn),70); };
const sPoke=(s)=>voice(degree((s&&s.soul?s.soul.pitch:10)+3),0.10,1,"sine",s&&s.soul?s.soul.pan:0);
const sHop=(s)=>voice(degree(s&&s.soul?s.soul.pitch:8),0.06,0.6,"sine",s&&s.soul?s.soul.pan:0);
const sEat=(s)=>voice(degree((s&&s.soul?s.soul.pitch:8)-2),0.12,0.8,"sine",s&&s.soul?s.soul.pan:0);
const sNuzzle=(a,b)=>{ voice(degree(a&&a.soul?a.soul.pitch:8),0.18,0.6,"sine",-0.2); voice(degree((b&&b.soul?b.soul.pitch:8)+2),0.18,0.6,"sine",0.2); };
const sHeart=()=>{ voice(degree(9),0.12,1,"sine",0); setTimeout(()=>voice(degree(12),0.14,1,"sine",0),90); };
const sErase=()=>{ if(!AC||muted)return; try{ const now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),hp=AC.createBiquadFilter(); o.type="sawtooth"; o.frequency.setValueAtTime(220,now); o.frequency.exponentialRampToValueAtTime(90,now+0.12); hp.type="highpass"; hp.frequency.value=560; g.gain.setValueAtTime(0.05,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.13); o.connect(hp);hp.connect(g);g.connect(busUI||AC.destination); o.start();o.stop(now+0.15);}catch(e){} };
const sChord=()=>{ [0,2,4,7].forEach((d,i)=>setTimeout(()=>voice(degree(6+d),1.6,1,"sine",(i-1.5)*0.3),i*70)); };  // the one major bloom, saved for the finale

/* ---- palette + tray ------------------------------------------------ */
const PAL=["#2b2822","#e0553f","#e6a33f","#5bb26b","#4a86c4","#8a5bc0"];
let color=L.color||PAL[0], tool="pen";
let tray={x:0,y:0,dots:[],eraser:{x:0,y:0,r:16},dogear:{x:0,y:0,s:26}};
function layoutTray(){
  const bx=26, by=H-40; tray.dots.length=0;
  for(let i=0;i<PAL.length;i++) tray.dots.push({x:bx+i*30,y:by,r:10,c:PAL[i]});
  tray.eraser.x=bx+PAL.length*30+18; tray.eraser.y=by;
  tray.dogear.x=W; tray.dogear.y=H;
}

/* ---- the world ----------------------------------------------------- */
let strokes=[];               // retained-mode marks; each may be alive
let fx=[];                    // particles / reaction icons
let foods=[];                 // crumbs (Update 1): flat objects, no sprites
const GROW_MAX=1.6, MAXPOP=40;
let breedCd=0;
let nextId=1;
let pointer={x:innerWidth/2,y:innerHeight/2,px:0,py:0,down:false,type:"mouse",vx:0,vy:0,speed:0};
let drawing=null;             // current stroke buffer
let grabbed=null;             // creature being flung
let baseDirty=true;
let page=0, corner=null;      // sketchbook (Update 2): current page + dog-ear peel state
let muteTimer=null;           // long-press-the-tray to mute

/* view transform (for the zoom-out reveal) */
let view={s:1,ox:0,oy:0,ts:1,tox:0,toy:0};

/* ---- stroke capture ------------------------------------------------ */
function beginStroke(x,y){
  drawing={id:nextId++, author:0, color:color, raw:[x,y,widthAt(0)], w:widthAt(0), lastx:x,lasty:y, lastt:performance.now()};
}
function extendStroke(x,y){
  if(!drawing)return; const t=performance.now(), dt=Math.max(1,t-drawing.lastt);
  const sp=dist(x,y,drawing.lastx,drawing.lasty)/dt;   // px/ms
  const pmul=(pointer.type==="pen"&&pointer.pressure)?clamp(pointer.pressure*1.6,.4,1.6):1;
  drawing.w=lerp(drawing.w, widthAt(sp)*pmul, 0.35);   // smooth, pressure folded into the target
  drawing.raw.push(x,y,drawing.w); drawing.lastx=x;drawing.lasty=y;drawing.lastt=t;
}
function widthAt(sp){ return clamp(13 - sp*6, 3, 14); }   // slow=fat, fast=thin, wider range
function endStroke(){
  if(!drawing)return; const raw=drawing.raw;
  if(raw.length<6){ // a tap, not a stroke -> drop a crumb (it sprouts into a creature if left)
    dropCrumb(raw[0],raw[1]); drawing=null; return;
  }
  const s=makeStroke(resample(raw,3), drawing.color, 0);
  strokes.push(s); L.drawn++; sesDrawn++; grow(1.0); comeAlive(s, strokes.length===1||L.drawn<=1?true:undefined);
  drawing=null; saveLedger();
}
function resample(raw,spacing){
  const pts=[]; let px=raw[0],py=raw[1],pw=raw[2]; pts.push(px,py,pw); let acc=0;
  for(let i=3;i<raw.length;i+=3){ let x=raw[i],y=raw[i+1],w=raw[i+2]; let d=dist(px,py,x,y);
    while(acc+d>=spacing){ const t=(spacing-acc)/d; px=lerp(px,x,t);py=lerp(py,y,t);pw=lerp(pw,w,t); pts.push(px,py,pw); d=dist(px,py,x,y); acc=0; }
    acc+=d; px=x;py=y;pw=w;
  }
  pts.push(raw[raw.length-3],raw[raw.length-2],raw[raw.length-1]);
  return new Float32Array(pts);
}

/* ---- ink rendering (variable width capsule stamping) --------------- */
function inkPath(g,pts,ox,oy){
  for(let i=0;i<pts.length-3;i+=3){
    const x1=pts[i]-ox,y1=pts[i+1]-oy,w1=pts[i+2], x2=pts[i+3]-ox,y2=pts[i+4]-oy,w2=pts[i+5];
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1, nx=-dy/len*0.5, ny=dx/len*0.5;
    g.beginPath();
    g.moveTo(x1+nx*w1,y1+ny*w1); g.lineTo(x2+nx*w2,y2+ny*w2);
    g.lineTo(x2-nx*w2,y2-ny*w2); g.lineTo(x1-nx*w1,y1-ny*w1); g.closePath(); g.fill();
    g.beginPath(); g.arc(x2,y2,w2*0.5,0,TAU); g.fill();
  }
  g.beginPath(); g.arc(pts[0]-ox,pts[1]-oy,pts[2]*0.5,0,TAU); g.fill();
}

/* ---- make a stroke object (+bake sprite, classify) ----------------- */
function bbox(pts){ let a=1e9,b=1e9,c=-1e9,d=-1e9,mw=0; for(let i=0;i<pts.length;i+=3){a=Math.min(a,pts[i]);c=Math.max(c,pts[i]);b=Math.min(b,pts[i+1]);d=Math.max(d,pts[i+1]);mw=Math.max(mw,pts[i+2]);} return {x:a,y:b,w:c-a,h:d-b,mw}; }
function makeStroke(pts,col,author,id){
  const bb=bbox(pts), pad=Math.ceil(bb.mw)+6;
  const spr=document.createElement("canvas"); spr.width=Math.max(2,Math.ceil((bb.w+pad*2)*DPR)); spr.height=Math.max(2,Math.ceil((bb.h+pad*2)*DPR));
  const sg=spr.getContext("2d"); sg.setTransform(DPR,0,0,DPR,0,0); sg.fillStyle=col;
  const ox=bb.x-pad, oy=bb.y-pad; inkPath(sg,pts,ox,oy);
  const closed=dist(pts[0],pts[1],pts[pts.length-3],pts[pts.length-2])< Math.max(18,bb.mw*2) && (bb.w+bb.h)>40;
  let kind="worm"; const span=bb.w+bb.h;
  if(span<26) kind="dot"; else if(closed) kind="blob"; else if(pts.length>90 && bb.w<span*0.7) kind="fuzz"; else kind="worm";
  return { id: id!=null ? id : (author ? nextId++ : (drawing ? drawing.id : nextId++)), author, pts, color:col, bb, sprW:bb.w+pad*2, sprH:bb.h+pad*2, spr, ox, oy,
    hx:bb.x, hy:bb.y, x:bb.x, y:bb.y, vx:0,vy:0, rot:0, scale:1, sq:0, closed, kind,
    alive:false, soul:null, born:performance.now(), phase:rnd(0,TAU), settled:true, growT:1 };
}

/* ---- give a stroke a soul (eyes) ----------------------------------- */
function comeAlive(s,hero){
  s.alive=true; s.settled=false; if(s.grow===undefined) s.grow=1;
  const temper=temperFor(s.color);
  s.soul={ state:"idle", blink:rnd(2,5), mood:0, wob:rnd(0,TAU), breathe:rnd(0,TAU),
    eyes:eyePlaces(s), pupils:[{x:0,y:0,vx:0,vy:0},{x:0,y:0,vx:0,vy:0}], flee:0, spared:false, tmr:0, temper,
    hunger:0, content:0.3, fed:0, refractory:0, nuzT:0, partner:null, gaze:null, gazeT:0,
    pitch:clamp(8+pitchOffset(temper)+Math.round((70-Math.min(s.bb.w,s.bb.h))/14),0,SCALE.length-1),
    pan:clamp((s.x/W)*2-1,-0.9,0.9) };
  s.floor=jarFloor();
  if(hero){ s.hero=true; s.vy=-3; s.sq=.5; } // first breath: guaranteed adorable
  sBorn(s); reactAt(s,"born");
}
function ew(s){ return s.bb.w*(s.grow||1); }   // effective size (food growth)
function eh(s){ return s.bb.h*(s.grow||1); }
function hueOf(hex){ const n=parseInt(hex.slice(1),16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; if(d<0.08) return -1; let h; if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; return h; }
function temperFor(c){ const h=hueOf(c); if(h<0) return "plain"; const anchors=[["hot",8],["bouncy",42],["social",135],["sleepy",215]]; let best="plain",bd=999; for(const [t,ah] of anchors){ let dd=Math.abs(h-ah); dd=Math.min(dd,360-dd); if(dd<bd){bd=dd;best=t;} } return best; }
function blendHex(a,b){ const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16); const r=((pa>>16&255)+(pb>>16&255))>>1,g=((pa>>8&255)+(pb>>8&255))>>1,bl=((pa&255)+(pb&255))>>1; return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1); }
function eyePlaces(s){
  const cx=(s.bb.w)/2, top=s.bb.h*0.3; const r=clamp(Math.min(s.bb.w,s.bb.h)*0.18,4,11);
  if(s.kind==="dot") return [{ox:s.bb.w/2,oy:s.bb.h/2,r:clamp(s.bb.w*0.5,5,10)}];
  if(s.kind==="worm"){ return [{ox:s.bb.w*0.12,oy:top,r}]; } // head end
  return [{ox:cx-r*1.4,oy:top,r},{ox:cx+r*1.4,oy:top,r}];
}
function jarFloor(){ return H-70; }
function seedDot(x,y){ const pts=new Float32Array([x-4,y,6, x,y,7, x+4,y,6]); const s=makeStroke(pts,color,1); strokes.push(s); comeAlive(s); grow(.3); reactAt(s,"spark"); }
/* ---- food (Update 1): tap = crumb; uneaten crumbs sprout into creatures */
function dropCrumb(x,y){
  for(const f of foods){ if(dist(x,y,f.x,f.y)<26){ f.amt++; f.r=clamp(f.r+2.2,5,15); tone(560,.05,.04,"sine"); return; } }  // tap near a crumb -> a bigger berry
  foods.push({x, y:Math.min(y,jarFloor()-4), r:6, amt:1, c:pick(["#c9843f","#d1a24a","#b5703a"]), vy:0, age:0});
  tone(520,.05,.04,"sine");
}
function eatFood(s,f){ const i=foods.indexOf(f); if(i<0)return; foods.splice(i,1); const so=s.soul;
  so.hunger=Math.max(0,so.hunger-0.5); so.content=Math.min(1,so.content+0.25); so.fed++; so.mood=0.9;
  s.grow=Math.min(GROW_MAX,(s.grow||1)+0.05*f.amt); s.sq=0.5; if(so.state==="seek")so.state="idle"; reactAt(s,"heart"); sEat(s); }
function foodsTick(dt){
  const anyLive=strokes.some(s=>s.alive&&!s.pending);
  for(let i=foods.length-1;i>=0;i--){ const f=foods[i]; f.vy+=0.28*dt*60/60; f.y+=f.vy; const fl=jarFloor()-f.r; if(f.y>fl){f.y=fl;f.vy=0;} f.age+=dt;
    const sproutAt = anyLive ? (FAST?8:45) : (FAST?2:6);   // fast-sprout when nothing is alive, so the pad is never inert
    if(f.age>sproutAt){ foods.splice(i,1); seedDot(f.x,f.y-f.r); }
  }
}
/* ---- breeding (Update 1): two content creatures nuzzle -> a baby is drawn
   into being BETWEEN them (never a mark elsewhere). Capped + refractory. */
function breedTick(dt){
  breedCd-=dt;
  // progress active courtships every frame: partners drift together, hearts rise, then a baby
  for(const s of strokes){ const so=s.soul; if(!so||so.state!=="nuzzle")continue; const p=so.partner;
    if(!p||!p.alive||!p.soul||p.soul.state!=="nuzzle"||p.soul.partner!==s||s.dissolve!==undefined||s===grabbed||p===grabbed||(tool==="eraser"&&pointer.down)){
      so.state="idle"; so.partner=null; so.face=null; if(p&&p.soul){p.soul.state="idle";p.soul.partner=null;p.soul.face=null;} continue; }
    if(s.id>p.id) continue;   // lead drives, once
    const acx=s.x+s.bb.w/2, acy=s.y+s.bb.h/2, bcx=p.x+p.bb.w/2, bcy=p.y+p.bb.h/2, mx=(acx+bcx)/2, my=(acy+bcy)/2;
    s.vx+=Math.sign(mx-acx)*0.14; p.vx+=Math.sign(mx-bcx)*0.14; s.vy+=Math.sign(my-acy)*0.08; p.vy+=Math.sign(my-bcy)*0.08;
    s.vx*=0.82; p.vx*=0.82; s.vy*=0.82; p.vy*=0.82; s.x+=s.vx; p.x+=p.vx; s.y+=s.vy; p.y+=p.vy;
    so.nuzT+=dt; p.soul.nuzT+=dt; so.face={x:bcx,y:bcy}; p.soul.face={x:acx,y:acy};
    if(Math.random()<dt*3){ fx.push({x:mx+rnd(-6,6),y:my-6,vx:rnd(-.3,.3),vy:rnd(-1.1,-.6),life:1.3,g:.01,txt:"♥",c:"#dd6b8a",sz:15}); sNuzzle(s,p); }
    if(so.nuzT>(FAST?0.8:2.0)) birth(s,p,mx,my);   // the drift keeps pulling them together; baby appears at the live midpoint
  }
  if(breedCd>0) return;
  breedCd=0.3;   // throttle the O(n^2) pair search
  const alive=strokes.filter(x=>x.alive&&!x.pending); if(alive.length>=MAXPOP) return;
  const cand=alive.filter(s=>s.dissolve===undefined&&s.soul&&(s.soul.state==="idle"||s.soul.state==="curious")&&s.soul.content>0.5&&s.soul.hunger<0.4&&s.soul.refractory<=0&&s!==grabbed&&!s.bait);
  let pair=null,pd=1e9;
  for(let i=0;i<cand.length;i++) for(let j=i+1;j<cand.length;j++){ const d=dist(cand[i].x,cand[i].y,cand[j].x,cand[j].y); if(d<pd){pd=d;pair=[cand[i],cand[j]];} }
  if(pair && pd<320){ const [a,c]=pair; a.soul.state=c.soul.state="nuzzle"; a.soul.partner=c; c.soul.partner=a; a.soul.nuzT=c.soul.nuzT=0; breedCd=FAST?3:18; }
}
function birth(a,b,mx,my){
  a.soul.state="idle"; b.soul.state="idle"; a.soul.partner=b.soul.partner=null; a.soul.face=b.soul.face=null;
  a.soul.content=b.soul.content=0.4; a.soul.refractory=b.soul.refractory=(FAST?4:25);
  if(strokes.filter(s=>s.alive).length>=MAXPOP){ reactAt(a,"heart"); return; }   // at cap: cozy, no baby
  const col=blendHex(a.color,b.color);
  const baby=makeStroke(warpShape(pick([a,b]).pts,mx,my), col, 1);
  baby.growT=0; baby.settled=false; baby.alive=false; baby.pending=true; baby.baby=true; baby.grow=0.45; baby.gen=Math.max(a.gen||0,b.gen||0)+1;
  strokes.push(baby); L.gen=Math.max(L.gen||0,baby.gen); L.loved=(L.loved||0)+1; saveLedger();
  for(let i=0;i<5;i++)fx.push({x:mx+rnd(-8,8),y:my,vx:rnd(-.5,.5),vy:rnd(-1.4,-.6),life:1.4,g:.02,txt:pick(["♥","✦"]),c:"#dd6b8a",sz:16});
  sBorn();
}

/* ---- reaction FX (wordless) ---------------------------------------- */
function reactAt(s,kind){
  const cx=s.x+s.bb.w/2, cy=s.y-6;
  const map={heart:"♥",spark:"✦",note:"♪",q:"?",ex:"!",z:"z",dust:"·"};
  if(kind==="dust"){ for(let i=0;i<6;i++)fx.push({x:cx+rnd(-8,8),y:s.y+s.bb.h/2,vx:rnd(-1,1),vy:rnd(-1.5,-.3),life:1,g:.05,txt:"·",c:s.color,sz:12}); return; }
  const c={heart:"#dd6b8a",ex:"#e0553f",q:"#4a86c4",note:"#8a5bc0",z:"#9a978c",spark:"#e6a33f"}[kind]||"#9a978c";
  for(let i=0;i<(kind==="heart"?3:2);i++) fx.push({x:cx+rnd(-10,10),y:cy,vx:rnd(-.4,.4),vy:rnd(-1.4,-.7),life:1,g:.02,txt:map[kind]||"·",c,sz:kind==="ex"?20:16});
  if(kind==="heart")sHeart();
}

/* ===================================================================
   THE DIRECTOR — one agency scalar + ledger triggers.
   Stages: 1 toy · 2 will(flee) · 3 pad draws back · 4 mimic ·
           5 other hand · 6 inversion · 7 finale/endings
   =================================================================== */
let stage=1;   // always start at the toy; memory shows through behaviour, not by skipping the joy
let agency=0, T=0, sinceInput=0, sinceIdleDraw=0, lull=false;
let sesDrawn=0, sesUndrew=0;                 // SESSION-local counts gate stages (persisted L.* would rush a returning player)
const K=FAST?7:1;                            // accelerator
function grow(n){ agency=clamp(agency+n*0.01*K,0,1); }
let director={otherCursor:null, invertT:0, finale:null, offered:false, ending:"", holdT:0, holdMoved:0, consent:false, mergeT:0, giant:null, sinceOffer:0};

function directorTick(dt){
  T+=dt; L.timeMs+=dt*1000;
  // advance stages by action + soft time floors (so any play style progresses)
  const t=T;
  if(stage<2 && sesDrawn>=3 && t>(FAST?6:35)) enterStage(2);
  if(stage<3 && sesDrawn>=6 && t>(FAST?12:55) && lull) padDrawsBack();
  if(stage>=3 && stage<4 && sesUndrew>=2 && lastPlayerShape) triggerMimic();
  if(stage>=4 && stage<5 && (t>(FAST?30:110) || sesUndrew>=4)) enterOtherHand();
  if(stage>=5 && stage<6 && (t>(FAST?45:170) || director.otherHandActs>=3 || nearPadEdge())) beginInversion();
  // occasional pad activity once awake
  if(stage>=3 && lull && Math.random()<0.006*K && strokes.filter(s=>s.alive).length<40) padDrawsBack(true);
  if(stage>=3) maybeSweetGesture();
}
function enterStage(n){ if(stage>=n)return; stage=n; L.stageMax=Math.max(L.stageMax,n); saveLedger(); }

/* Stage 3 — the pad draws back (autodraw a stroke point by point) */
let lastPlayerShape=null;
function padDrawsBack(minor){
  enterStage(3);
  if(!minor && Math.random()<0.5 && completeOpen()) return;   // sometimes: finish one of YOUR open lines instead of drawing its own
  const near = strokes.find(s=>s.alive) || {x:W/2,y:H/2,bb:{w:0,h:0}};
  const ax=clamp((near.x||W/2)+rnd(-120,120),60,W-60), ay=clamp((near.y||H/2)+rnd(-60,60),80,jarFloor()-20);
  const pts=genPadStroke(ax,ay, minor?0.6:1);
  const s=makeStroke(pts, color, 1);
  s.growT=0; s.settled=false; s.alive=false; s.pending=true;
  strokes.push(s); L.undrew++; sesUndrew++; saveLedger();
}
function genPadStroke(cx,cy,scale){
  // a small hand-drawn-looking blob/loop in the player's palette
  const n=6+(Math.random()*4|0), rad=rnd(16,34)*scale, out=[];
  const cpts=[]; for(let i=0;i<=n;i++){ const a=i/n*TAU; const rr=rad*(0.7+Math.random()*0.5); cpts.push(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.85); }
  // catmull-rom sample
  for(let i=0;i<cpts.length/2-1;i++){
    const p0=vp(cpts,i-1),p1=vp(cpts,i),p2=vp(cpts,i+1),p3=vp(cpts,i+2);
    for(let t=0;t<1;t+=0.2){ const tt=t*t,ttt=tt*t;
      const x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*tt+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*ttt);
      const y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*tt+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*ttt);
      out.push(x+rnd(-.6,.6), y+rnd(-.6,.6), rnd(4,8));
    }
  }
  return resample(new Float32Array(out),3);
}
function vp(a,i){ i=clamp(i,0,a.length/2-1); return [a[i*2],a[i*2+1]]; }
/* the pad quietly finishes one of your open lines — never editing your marks,
   only adding a stroke that closes the loop in your own colour (Duck-Amuck, tender) */
function completeOpen(){
  const open=strokes.filter(s=>s.alive && s.author===0 && s.kind==="worm" && !s.closed && !s.completed);
  if(!open.length) return false; const t=pick(open); t.completed=true;
  const n=t.pts.length, ex=t.pts[n-3], ey=t.pts[n-2], sx=t.pts[0], sy=t.pts[1];
  const bow=(Math.random()<0.5?1:-1), out=[]; const steps=12;
  for(let i=0;i<=steps;i++){ const u=i/steps; out.push(lerp(ex,sx,u)+Math.sin(u*Math.PI)*46*bow, lerp(ey,sy,u)-Math.sin(u*Math.PI)*34, 5); }
  const s=makeStroke(resample(new Float32Array(out),3), t.color, 1);
  s.growT=0; s.settled=false; s.alive=false; s.pending=true;
  strokes.push(s); L.undrew++; sesUndrew++; saveLedger(); return true;
}

/* Stage 3.5 — a sweet unprompted mark: a heart above a creature */
let sweetDone=0;
function maybeSweetGesture(){
  if(sweetDone>=2 || Math.random()>0.004*K) return;
  const cands=strokes.filter(s=>s.alive && !s.hero); if(cands.length<1)return;
  const s=pick(cands); reactAt(s,"heart"); sweetDone++;
  for(let i=0;i<4;i++)fx.push({x:s.x+s.bb.w/2+rnd(-6,6),y:s.y-10,vx:rnd(-.3,.3),vy:rnd(-1.2,-.6),life:1.4,g:.01,txt:"♥",c:"#dd6b8a",sz:16});
}

/* Stage 4 — a creature mimics your last shape, slightly wrong */
function triggerMimic(){
  enterStage(4);
  if(!lastPlayerShape) return;
  const watcher=strokes.find(s=>s.alive); if(!watcher)return;
  const ax=clamp(watcher.x+rnd(40,90),60,W-80), ay=clamp(watcher.y,80,jarFloor()-20);
  const pts=warpShape(lastPlayerShape, ax, ay);
  const s=makeStroke(pts, color, 1); s.growT=0; s.settled=false; s.alive=false; s.pending=true; s.mimic=true;
  strokes.push(s); L.undrew++; sesUndrew++; reactAt(watcher,"note");
  lastPlayerShape=null;
}
function warpShape(src,cx,cy){
  const bb=bbox(src); const sx=cx-bb.x-bb.w/2, sy=cy-bb.y-bb.h/2; const out=[];
  for(let i=0;i<src.length;i+=3){ out.push(src[i]+sx+rnd(-4,4), src[i+1]+sy+rnd(-4,4), src[i+2]*rnd(.8,1.1)); }
  return resample(new Float32Array(out),3);
}

/* Stage 5 — the other hand (a second, heavier author) */
function enterOtherHand(){
  enterStage(5);
  director.otherCursor={x:W-60,y:60,tx:W/2,ty:H/2,active:true}; director.otherHandActs=0;
}
function otherHandTick(dt){
  const oc=director.otherCursor; if(!oc)return;
  // drift toward a target; occasionally redraw an erased spot or draw on your side
  oc.x=lerp(oc.x,oc.tx,0.03); oc.y=lerp(oc.y,oc.ty,0.03);
  if(dist(oc.x,oc.y,oc.tx,oc.ty)<12 && Math.random()<0.02*K){
    oc.tx=rnd(80,W-80); oc.ty=rnd(90,jarFloor()-30);
    if(Math.random()<0.6){ const pts=genPadStroke(oc.x,oc.y,1.1); const s=makeStroke(pts,pick(["#7a6f5c","#5a5346"]),1); s.growT=0;s.settled=false;s.alive=false;s.pending=true; s.heavy=true; strokes.push(s); director.otherHandActs++; }
    else ablate();
  }
}
let ablations=0;
function ablate(){ // gentle, always restored — never a fake crash
  if(ablations>3)return; ablations++;
  const kind=pick(["desat","tidy"]);
  if(kind==="desat"){ document.documentElement.style.filter="saturate(.5)"; setTimeout(()=>document.documentElement.style.filter="",1600); }
  else { const a=strokes.find(s=>s.author===0 && s.alive); if(a){ a.tidied=true; setTimeout(()=>a.tidied=false,1800);} }
}

/* Stage 6 — the inversion: zoom out; you are a mark too */
let backdrop=null;
function beginInversion(){
  enterStage(6); L.seenTurn=true; saveLedger();
  buildBackdrop();
  view.ts=RM?0.5:0.14; view.tox=W*0.5-(W*0.5)*view.ts; view.toy=H*0.5-(H*0.5)*view.ts;
  director.invertT=0;
  director.giant={x:W*0.5,y:-200,ty:H*0.3};
}
function buildBackdrop(){
  backdrop=document.createElement("canvas"); backdrop.width=Math.floor(W*DPR); backdrop.height=Math.floor(H*DPR);
  const bg=backdrop.getContext("2d"); bg.setTransform(DPR,0,0,DPR,0,0);
  bg.fillStyle=css("--paper2"); bg.fillRect(0,0,W,H);
  // scatter faint doodle-ish marks: a vast pad of other small pads
  bg.globalAlpha=0.5;
  for(let i=0;i<220;i++){ const x=rnd(0,W),y=rnd(0,H),r=rnd(4,16); bg.strokeStyle=css("--edge"); bg.lineWidth=1.5;
    bg.beginPath(); const seg=3+(Math.random()*4|0); bg.moveTo(x,y);
    for(let j=0;j<seg;j++) bg.lineTo(x+rnd(-r,r),y+rnd(-r,r)); bg.stroke();
    if(Math.random()<0.3){ bg.fillStyle=css("--edge"); bg.fillRect(x-1,y-1,2,2); }
  }
  bg.globalAlpha=1;
}

/* ---- endings ------------------------------------------------------- */
function offerFinale(){
  if(director.offered)return; director.offered=true;
  // the giant hand stops descending and sets its eraser down beside your mark — an offer, not a threat
  if(director.giant) director.giant.ty=director.giant.y;
  director.finale={eraser:{x:clamp(pointer.x+70,60,W-60), y:clamp(pointer.y,80,H-90)}, merged:0};
}
let ending="";
function doMerge(){ if(ending)return; ending="merge"; director.mergeT=0; if(director.giant)director.giant.ty=director.giant.y; sChord();
  const alive=strokes.filter(s=>s.alive); let i=0; const n=Math.max(1,alive.length);
  for(const s of alive){ if(s.soul){ s.soul.state="merge"; s.soul.slot=i/n*TAU; i++; } }
  view.ts=RM?0.7:0.5; view.tox=W*0.5-(W*0.5)*view.ts; view.toy=H*0.5-(H*0.5)*view.ts;  // re-approach for the tableau
}
function doErase(waved){ if(ending)return; ending="erase"; foods.length=0; book.length=0;
  // real, consensual: clear EVERYTHING the game kept — snapshot keys first (removing while iterating skips keys)
  wiped=true;
  try{ const keys=Object.keys(localStorage).filter(k=>k.indexOf("doodle.")===0 && k!=="doodle.scar"); for(const k of keys) localStorage.removeItem(k); }catch(e){}
  try{ localStorage.setItem("doodle.scar",JSON.stringify({left:Date.now(),drawn:L.drawn})); }catch(e){}
  // each turns to you and gives a little farewell hop, then dissolves
  let i=0; for(const s of strokes){ if(s.alive){ s.wave=waved?1:0; if(waved){ s.vy=-3.2-((i++)%3); s.sq=0.4; reactAt(s,waved?"heart":"dust"); } setTimeout(()=>{ s.dissolve=0.001; }, waved? 700+ (i*40):0); } }
  sChord();
}
let fxMsgTimer=0;

/* ===================================================================
   SIMULATION
   =================================================================== */
function nearPadEdge(){ return pointer.x<24||pointer.x>W-24||pointer.y<24||pointer.y>H-24; }
function awakeCount(){ let n=0; for(const s of strokes) if(s.alive&&!s.settled&&s.soul&&s.soul.state!=="sleep")n++; return n; }

function step(dt){
  directorTick(dt);
  if(stage>=5) otherHandTick(dt);
  // view lerp
  view.s=lerp(view.s,view.ts,0.02); view.ox=lerp(view.ox,view.tox,0.02); view.oy=lerp(view.oy,view.toy,0.02);
  if(stage===6){ director.invertT+=dt; if(director.offered) director.sinceOffer+=dt;
    if(director.giant){ const gi=director.giant; gi.y=lerp(gi.y,gi.ty,0.012);
      if(!RM){ gi.bob=(gi.bob||0)+dt; gi.lean=lerp(gi.lean||0, clamp((pointer.x-gi.x)/W*0.3,-0.12,0.12), 0.05); }  // curious, alive — a soft lean toward your mark
      if(director.invertT>4) offerFinale(); }
  }
  // pointer velocity + idle/lull
  pointer.vx=pointer.x-pointer.px; pointer.vy=pointer.y-pointer.py; pointer.speed=Math.hypot(pointer.vx,pointer.vy);
  pointer.px=pointer.x; pointer.py=pointer.y;
  if(pointer.down||pointer.speed>1.2){ sinceInput=0; lull=false; } else { sinceInput+=dt; if(sinceInput>(FAST?1.4:3.5)) lull=true; }

  const awakeCap=36;
  let awake=0;
  for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i];
    // grow (pad drawing itself in)
    if(s.pending){ s.growT=clamp(s.growT+dt*1.2,0,1); if(s.growT>=1){ s.pending=false; comeAlive(s); if(s.mimic)reactAt(s,"spark"); }
      continue; }
    if(!s.alive){ continue; }
    // dissolve on erase-ending
    if(s.dissolve!==undefined){ s.dissolve+=dt*0.6; if(s.dissolve>1){ strokes.splice(i,1); } continue; }
    const so=s.soul; if(!so) continue;
    // sleep governor
    if(so.state!=="sleep"){ awake++; if(awake>awakeCap){ so.state="sleep"; } }
    // physics
    const cx=s.x+s.bb.w/2, cy=s.y+s.bb.h/2;
    if(s!==grabbed && so.state!=="sleep"){
      if(so.state!=="merge"&&so.state!=="nuzzle") s.vy+=0.28*dt*60/60; // gravity (skip while gathering)
      // flee the eraser (stage>=2)
      if(stage>=2 && tool==="eraser" && pointer.down){ const d=dist(pointer.x,pointer.y,cx,cy);
        if(d<150){ so.state="flee"; so.flee=1; const a=Math.atan2(cy-pointer.y,cx-pointer.x); s.vx+=Math.cos(a)*0.9; s.vy+=Math.sin(a)*0.6-0.2; if(Math.random()<0.02)reactAt(s,"ex"); }
      } else if(so.state==="flee" && so.flee>0){ so.flee-=dt; if(so.flee<=0){ so.state="idle"; } }
      // hunger & feeding — very gentle; neglect means naps, never death
      if(so.state==="idle"||so.state==="curious"||so.state==="seek"){
        so.hunger=Math.min(1,so.hunger+dt*0.012*(FAST?12:1));
        if(so.hunger>0.35 && foods.length){ let f=null,fd=1e9; for(const ff of foods){ const d=dist(cx,cy,ff.x,ff.y); if(d<300&&d<fd){fd=d;f=ff;} }
          if(f){ so.state="seek"; s.vx+=Math.sign(f.x-cx)*(so.temper==="hot"?0.16:0.1); if(f.y<cy-6)s.vy-=0.1; if(fd<ew(s)*0.5+f.r+8) eatFood(s,f); }
          else if(so.state==="seek") so.state="idle";
        } else if(so.state==="seek") so.state="idle";
      }
      // merge finale: ease into a ring slot around your mark (world coords through the zoom-out)
      if(so.state==="merge"){
        const pwx=(pointer.x-view.ox)/view.s, pwy=(pointer.y-view.oy)/view.s, rr=90/view.s;
        const tx=pwx+Math.cos(so.slot||0)*rr, ty=pwy+Math.sin(so.slot||0)*rr;
        s.vx+=(tx-cx)*0.02; s.vy+=(ty-cy)*0.02; s.vx*=0.85; s.vy*=0.85;
        if(director.mergeT>(RM?2:4)){ s.vx*=0.5; s.vy*=0.5; }   // settle into a held pose
      }
      // curiosity: drift toward cursor on lull (ducklings)
      if((so.state==="idle"||so.state==="curious") && !nearPadEdge()){
        const d=dist(pointer.x,pointer.y,cx,cy);
        if(d<260 && d>40 && (so.temper==="social"||so.spared||lull||Math.random()<0.3)){ so.state="curious"; s.vx+=Math.sign(pointer.x-cx)*0.08; if(cy>pointer.y+10)s.vy-=0.12; }
        else if(so.state==="curious"&&d>320) so.state="idle";
      }
      // temperament flavour
      if(so.temper==="bouncy" && Math.abs(s.vy)<0.4 && Math.random()<0.02){ s.vy=-3.4; sHop(s); }
      if(so.temper==="hot" && Math.random()<0.03){ s.vx+=rnd(-1.2,1.2); }   // restless darts
      s.vx*=0.96; s.x+=s.vx; s.y+=s.vy;
      // floor bounce (effective size, so grown creatures rest on the floor)
      const fl=jarFloor()-eh(s)*0.5;
      if(s.y> fl){ if(s.vy>3 && !RM) reactAt(s,"dust"); s.y=fl; if(s.vy>1.2){ s.sq=Math.min(1,s.vy*0.08); sHop(s); } s.vy*=-0.42; s.vx*=0.86; }
      // walls
      if(s.x<6){s.x=6;s.vx=Math.abs(s.vx)*0.5;} if(s.x>W-ew(s)-6){s.x=W-ew(s)-6;s.vx=-Math.abs(s.vx)*0.5;}
      if(s.y<40){s.y=40;s.vy=Math.abs(s.vy)*0.4;}
    }
    // soul animation
    so.wob+=dt*(RM?1.2:2.4); so.breathe+=dt*1.6; so.blink-=dt; if(so.blink<-0.12)so.blink=rnd(2.5,6);
    so.mood=lerp(so.mood,0,dt*2);   // moods ease back to neutral
    if(so.refractory>0) so.refractory-=dt;
    s.sq*=0.86;
    if(s.dizzy>0){ s.dizzy-=dt; s.rot+=0.5; } else if(s.rot){ s.rot*=0.85; if(Math.abs(s.rot)<0.01)s.rot=0; }
    // pupils spring to cursor, shoved by body accel
    let gx=pointer.x, gy=pointer.y;
    if(pointer.type==="touch" && !pointer.down){ if(!so.gaze||so.gazeT<T){ so.gaze={x:rnd(40,W-40),y:rnd(60,H-100)}; so.gazeT=T+rnd(2,5); } gx=so.gaze.x; gy=so.gaze.y; }  // no hover on touch: gentle wander gaze
    if(so.state==="merge" && director.giant){ gx=director.giant.x; gy=director.giant.y; }  // at the merge, all eyes turn outward
    if(so.state==="nuzzle" && so.face){ gx=so.face.x; gy=so.face.y; }                       // courting: eyes on partner
    for(let e=0;e<so.eyes.length;e++){ const p=so.pupils[e]; const eye=so.eyes[e];
      const ex=s.x+eye.ox, ey=s.y+eye.oy; let tx=(gx-ex), ty=(gy-ey); const el=Math.hypot(tx,ty)||1; const mr=eye.r*0.45;
      tx=tx/el*mr - s.vx*0.6; ty=ty/el*mr - s.vy*0.6;
      p.vx+=(tx-p.x)*0.2; p.vy+=(ty-p.y)*0.2; p.vx*=0.7; p.vy*=0.7; p.x+=p.vx; p.y+=p.vy;
    }
    // idle -> sleep zzz (perf + life); sleepy naps sooner, hot resists
    if(so.state==="idle" && so.content<0.55 && Math.abs(s.vx)<0.15 && Math.abs(s.y-(jarFloor()-eh(s)*0.5))<4){ so.tmr+=dt;
      const nap = so.temper==="sleepy"?(FAST?2:5) : so.temper==="hot"?(FAST?7:18) : (FAST?4:10);
      if(so.tmr>nap){ so.state="sleep"; reactAt(s,"z"); } } else so.tmr=0;   // content creatures stay lively (they'll court)
    if(so.state==="sleep" && (pointer.speed>4 && dist(pointer.x,pointer.y,cx,cy)<120)){ so.state="idle"; so.tmr=0; }
  }
  // gentle separation so creatures spread out instead of piling into a column
  const aw=[]; for(const s of strokes){ if(s.alive&&s.soul&&s.soul.state!=="sleep"&&s.soul.state!=="merge"&&s.soul.state!=="nuzzle"&&s!==grabbed&&s.dissolve===undefined&&!s.pending) aw.push(s); }
  for(let i=0;i<aw.length;i++){ const a=aw[i], ax=a.x+a.bb.w/2, ay=a.y+a.bb.h/2, ar=Math.max(ew(a),eh(a))*0.4+7;
    for(let j=i+1;j<aw.length;j++){ const b=aw[j], bx=b.x+b.bb.w/2, by=b.y+b.bb.h/2, br=Math.max(ew(b),eh(b))*0.4+7;
      let dx=ax-bx, dy=ay-by, d=Math.hypot(dx,dy)||0.01, min=ar+br;
      if(d<min){ const push=(min-d)/min*0.5; dx/=d; dy/=d; a.vx+=dx*push; a.vy+=dy*push*0.5; b.vx-=dx*push; b.vy-=dy*push*0.5; } } }
  // merge finale: creatures gather warmly to your mark, hearts rise
  if(ending==="merge"){ director.mergeT+=dt; if(Math.random()<0.12){ const c=strokes.filter(x=>x.alive); if(c.length) reactAt(pick(c),"heart"); } }
  // particles
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=dt*0.9; if(p.life<=0)fx.splice(i,1); }
  if(fx.length>200)fx.splice(0,fx.length-200);
  // bait blob early self-demo (stage1): a resting critter toddles to cursor
  baitTick(dt);
  foodsTick(dt);
  breedTick(dt);
  // finale ending detection
  finaleDetect(dt);
  if(fxMsgTimer>0)fxMsgTimer-=dt;
  if(performance.now()-lastSave>2000){ lastSave=performance.now(); saveLedger(); saveBook(); }
}

/* bait: on load, one wandering blob demonstrates aliveness with no text */
let bait=null;
function baitTick(dt){
  if(stage>1)return;
  if(!bait && L.drawn===0 && strokes.length===0){ // create a resting demo doodle with an unmissable birth
    const cx=W/2,cy=H/2; const pts=genPadStroke(cx,cy,1); bait=makeStroke(pts, THEME.ink, 1); strokes.push(bait);
    bait.bait=true; comeAlive(bait); bait.soul.temper="social"; bait.vy=-3.2; bait.sq=0.6; reactAt(bait,"spark"); }
  if(bait && L.drawn>0){ bait=null; } // once the player draws, stop babysitting
}

/* finale endings: A merge (idle+low cruelty), B consensual erase (hold-drag) */
function finaleDetect(dt){
  if(stage<6 || !director.offered || ending) return;
  const cruel=L.erasedAlive>=5;
  // B: the consent gesture — pick up the offered eraser, then a slow deliberate hold-drag (>=2s).
  //    Only counts once the eraser is actually in hand (director.consent), so it can never be an accident.
  if(pointer.down && director.consent){ director.holdT+=dt; director.holdMoved+=pointer.speed;
    if(director.holdT>2 && director.holdMoved>120){ doErase(!cruel); }
  } else { director.holdT=0; director.holdMoved=0; }
  // A: do nothing — hold still and let them gather to you (gentle player only).
  //    Give a real window after the offer, and never merge while they're reaching for the eraser.
  if(!cruel && !director.consent && director.sinceOffer>(FAST?4:8) && sinceInput>(FAST?3:6)){
    const nearErase = director.finale && dist(pointer.x,pointer.y,director.finale.eraser.x,director.finale.eraser.y)<90;
    const near = strokes.filter(s=>s.alive && dist(s.x+s.bb.w/2,s.y+s.bb.h/2,pointer.x,pointer.y)<170).length;
    if(near>=2 && !nearErase) doMerge();
  }
}

/* ===================================================================
   RENDER
   =================================================================== */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // backdrop (inversion)
  if(backdrop){ ctx.globalAlpha=clamp((1-view.s)*1.1,0,1); ctx.drawImage(backdrop,0,0,W,H); ctx.globalAlpha=1; }
  else { ctx.fillStyle=THEME.paper; ctx.fillRect(0,0,W,H); }
  ctx.save();
  ctx.translate(view.ox,view.oy); ctx.scale(view.s,view.s);
  // the pad's own sheet (so the zoom-out shows it as one small sheet)
  if(view.s<0.98){ ctx.fillStyle=THEME.paper; ctx.strokeStyle=THEME.edge; ctx.lineWidth=2/view.s; roundRect(0,0,W,H,10); ctx.fill(); ctx.stroke(); }
  // crumbs (behind creatures), then strokes
  for(const f of foods){ ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill();
    if(f.amt>1){ ctx.fillStyle=shade(f.c,0.3); ctx.beginPath(); ctx.arc(f.x-f.r*0.3,f.y-f.r*0.3,f.r*0.35,0,TAU); ctx.fill(); } }
  for(const s of strokes) drawStroke(s);
  ctx.restore();
  // giant cursor (inversion) — a soft bob so it reads curious/alive
  if(director.giant){ const gi=director.giant; drawGiantCursor(gi.x, gi.y + ((!RM&&gi.bob)?Math.sin(gi.bob*1.1)*3:0)); }
  // other-hand cursor
  if(director.otherCursor&&director.otherCursor.active) drawNib(director.otherCursor.x,director.otherCursor.y,"#5a5346",1.6);
  // tray
  drawTray();
  // particles
  for(const p of fx){ ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.c; ctx.font=`${p.sz}px ui-monospace,monospace`; ctx.textAlign="center"; ctx.fillText(p.txt,p.x,p.y); }
  ctx.globalAlpha=1;
  // finale eraser offered
  if(director.finale&&director.finale.eraser&&!ending){ const e=director.finale.eraser; ctx.fillStyle="#e4b8c4"; roundRect(e.x-16,e.y-11,32,22,8); ctx.fill(); ctx.strokeStyle="#c99aa8"; ctx.stroke(); }
  // player's drawn cursor (unless touch)
  if(pointer.type!=="touch"){
    if(stage>=6 && director.invertT>1) drawSelfMark(pointer.x,pointer.y); // you are ink now
    else if(tool==="eraser") drawEraser(pointer.x,pointer.y);
    else drawNib(pointer.x,pointer.y,color,1);
  }
  // ending overlays
  if(ending==="erase" && strokes.every(s=>!s.alive)) drawGone();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawStroke(s){
  if(s.pending){ // the pad drawing itself in, point by point
    const k=Math.max(2,Math.floor((s.pts.length/3)*s.growT))*3;
    inkPathAbs(s.pts.subarray(0,k), s.color); return;
  }
  const so=s.soul, bw=s.bb.w, bh=s.bb.h, pad=(s.sprW-bw)/2;
  ctx.save();
  ctx.translate(s.x+bw/2, s.y+bh/2);
  let alpha=1;
  if(s.dissolve!==undefined) alpha=clamp(1-s.dissolve,0,1);
  if(s.tidied) alpha*=0.9;
  ctx.globalAlpha=alpha;
  // fake-3D floor shadow (alive only)
  if(s.alive){ ctx.save(); ctx.globalAlpha=alpha*0.13; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(0,bh/2+6,bw*0.42,5,0,0,TAU); ctx.fill(); ctx.restore(); }
  const sq=1-s.sq*0.4, st=1+s.sq*0.4;
  const wob=(s.alive&&so&&!RM)?Math.sin(so.wob)*0.03:0;
  const br=(s.alive&&so&&!RM)?Math.sin(so.breathe)*0.02:0;   // breathing
  const gsc=s.grow||1;
  ctx.rotate((s.rot||0)+wob); ctx.scale(st*(1-br)*gsc, sq*(1+br)*gsc);
  // the baked ink, centered
  ctx.drawImage(s.spr, -bw/2-pad, -bh/2-pad, s.sprW, s.sprH);
  // face
  if(s.alive && so){
    const asleep=so.state==="sleep", flee=so.state==="flee";
    const blinking = !asleep && so.blink<0 && so.blink>-0.12;   // brief lid-close
    for(let e=0;e<so.eyes.length;e++){ const eye=so.eyes[e], p=so.pupils[e]||{x:0,y:0};
      const ex=-bw/2+eye.ox, ey=-bh/2+eye.oy;
      if(asleep||blinking){ ctx.strokeStyle="#1e1e1e"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ex-eye.r*0.7,ey); ctx.lineTo(ex+eye.r*0.7,ey); ctx.stroke(); continue; }
      ctx.fillStyle="#f6f6f1"; ctx.beginPath(); ctx.arc(ex,ey,eye.r,0,TAU); ctx.fill();
      const pr=flee?eye.r*0.3:eye.r*0.42, px=ex+p.x, py=ey+p.y-(flee?eye.r*0.2:0);
      ctx.fillStyle="#1c1c1c"; ctx.beginPath(); ctx.arc(px,py,pr,0,TAU); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(px-pr*0.35,py-pr*0.5,pr*0.34,0,TAU); ctx.fill(); // glint
    }
    if(!asleep){ ctx.strokeStyle="#1c1c1c"; ctx.lineWidth=Math.max(1.5,Math.min(bw,bh)*0.05);
      const mood=flee?-0.7:((so.mood||0)+(so.state==="curious"?0.35:0));
      const my=Math.min(bh,bw)*0.14, mw=Math.min(bw,bh)*0.16;
      ctx.beginPath(); ctx.moveTo(-mw,my); ctx.quadraticCurveTo(0,my+mood*mw,mw,my); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
  // sleeping zzz occasionally
  if(s.alive && so && so.state==="sleep" && Math.random()<0.004){ reactAt(s,"z"); }
}
function inkPathAbs(pts,col){ ctx.fillStyle=col; inkPath(ctx,pts,0,0); }

/* ---- cursors / faces ---------------------------------------------- */
function drawNib(x,y,col,scale){ ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(6,-16); ctx.lineTo(10,-13); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(col,0.4); ctx.fillRect(6,-30,4,16); ctx.restore(); }
function drawEraser(x,y){ ctx.save(); ctx.translate(x,y); ctx.fillStyle="#e4b8c4"; roundRect(-13,-9,26,18,6); ctx.fill(); ctx.strokeStyle="#c99aa8"; ctx.stroke(); ctx.restore(); }
function drawGiantCursor(x,y){ ctx.save(); ctx.translate(x,y);
  const lean=director.giant&&director.giant.lean||0; ctx.rotate(lean);
  ctx.globalAlpha=0.6; ctx.fillStyle=THEME.ink;
  // a soft pencil, held loosely — curious, not a blade
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(44,-118); ctx.quadraticCurveTo(60,-112,76,-100); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(THEME.ink,0.35); roundRect(44,-260,30,150,8); ctx.fill(); ctx.restore(); }
function drawSelfMark(x,y){ // your cursor, now a mark among them: shadow + tiny eyes
  ctx.save(); ctx.translate(x,y);
  ctx.globalAlpha=0.14; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(6,10,10,4,0,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  drawNib(0,0,color,1);
  const flinch = nearPadEdge()?3:0;
  ctx.fillStyle="#f4f4f0"; ctx.beginPath(); ctx.arc(8,-8+flinch,4,0,TAU); ctx.arc(15,-8+flinch,4,0,TAU); ctx.fill();
  ctx.fillStyle="#1e1e1e"; const lx=clamp((director.giant?director.giant.x-x:0)/200,-2,2);
  ctx.beginPath(); ctx.arc(8+lx,-8+flinch,1.8,0,TAU); ctx.arc(15+lx,-8+flinch,1.8,0,TAU); ctx.fill();
  ctx.restore();
}
function drawTray(){
  if(trayFlash>0) trayFlash-=0.03;                                  // mute-toggle confirm flash
  const trayA=clamp((view.s-0.55)/0.45,0,1); if(trayA<=0) return;   // fade out as the pad recedes
  ctx.save(); ctx.globalAlpha=trayA*(trayFlash>0?0.5:1);
  for(const d of tray.dots){ ctx.fillStyle=d.c; ctx.beginPath(); ctx.arc(d.x,d.y,d.r*(d.c===color&&tool==="pen"?1.35:1),0,TAU); ctx.fill();
    if(d.c===color&&tool==="pen"){ ctx.strokeStyle=THEME.ink; ctx.lineWidth=1.5; ctx.stroke(); } }
  const e=tray.eraser; ctx.fillStyle="#e4b8c4"; roundRect(e.x-14,e.y-10,28,20,7); ctx.fill();
  if(tool==="eraser"){ ctx.strokeStyle=THEME.ink; ctx.lineWidth=1.5; ctx.stroke(); }
  // dog-ear (turn page / tap = undo)
  ctx.fillStyle=THEME.paper2; ctx.strokeStyle=THEME.edge;
  const pk=corner?corner.peel*Math.min(W,H)*0.4:0;                 // peel curl grows as you drag it
  ctx.beginPath(); ctx.moveTo(W,H-26-pk); ctx.lineTo(W,H); ctx.lineTo(W-26-pk,H); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(page>0){ ctx.beginPath(); ctx.moveTo(0,H-26); ctx.lineTo(0,H); ctx.lineTo(26,H); ctx.closePath(); ctx.fill(); ctx.stroke(); } // flip-back appears once there are prior pages
  ctx.restore();
}
function drawGone(){ ctx.fillStyle=THEME.paper; ctx.fillRect(0,0,W,H); }

/* ===================================================================
   POINTER
   =================================================================== */
function pos(e){ return {x:e.clientX, y:e.clientY}; }
cv.addEventListener("pointerdown",e=>{ unlock(); cv.setPointerCapture(e.pointerId); const p=pos(e);
  pointer.x=p.x;pointer.y=p.y;pointer.down=true;pointer.type=e.pointerType;pointer.pressure=e.pressure;
  sinceInput=0; lull=false;
  // finale: the pad is drawn; you can pick up the offered eraser (consent), or do nothing.
  if(stage>=6 && director.offered){ if(director.finale && dist(p.x,p.y,director.finale.eraser.x,director.finale.eraser.y)<48){ director.consent=true; } return; }
  // mute: long-press anywhere along the tray row (invisible; a soft note + tray flash confirms)
  if(p.y>H-64 && p.x<tray.eraser.x+40){ if(muteTimer)clearTimeout(muteTimer); muteTimer=setTimeout(toggleMute,600); }
  // tray hit?
  if(hitTray(p.x,p.y)){ return; }
  // dog-ear (bottom-right): drag to peel a fresh page, quick tap = undo (resolved on release)
  if(p.x>W-32 && p.y>H-32 && stage<6){ corner={sx:p.x, sy:p.y, peel:0}; return; }
  // flip-back dog-ear (bottom-left) appears once there are prior pages
  if(page>0 && p.x<32 && p.y>H-32 && stage<6){ turnPage(-1); return; }
  if(tool==="eraser"){ eraseAt(p.x,p.y); return; }
  // grab a creature?
  const c=creatureAt(p.x,p.y);
  if(c){ grabbed=c; c.soul&&(c.soul.state="idle"); c.grabX=p.x-c.x; c.grabY=p.y-c.y; sPoke(); return; }
  beginStroke(p.x,p.y);
});
addEventListener("pointermove",e=>{ const p=pos(e); pointer.x=p.x;pointer.y=p.y;pointer.pressure=e.pressure;
  if(muteTimer){ clearTimeout(muteTimer); muteTimer=null; }   // moving cancels the mute long-press
  if(!pointer.down) return;
  if(corner){ corner.peel=clamp(((corner.sx-p.x)+(corner.sy-p.y))/(Math.min(W,H)*0.4),0,1); return; }  // peeling the page corner
  if(stage>=6 && director.offered) return; // finale: no drawing; your cursor is just a mark now
  if(grabbed){ const nx=p.x-grabbed.grabX, ny=p.y-grabbed.grabY; grabbed.vx=(nx-grabbed.x)*0.6; grabbed.vy=(ny-grabbed.y)*0.6; grabbed.x=nx; grabbed.y=ny; return; }
  if(tool==="eraser" && pointer.down){ eraseAt(p.x,p.y); return; }
  if(drawing){ if(getCo) for(const ev of getCo.call(e)){ extendStroke(ev.clientX,ev.clientY); } else extendStroke(p.x,p.y); }
});
addEventListener("pointerup",e=>{ pointer.down=false; director.consent=false; director.holdT=0; director.holdMoved=0;
  if(muteTimer){ clearTimeout(muteTimer); muteTimer=null; }
  if(corner){ const travel=dist(corner.sx,corner.sy,pointer.x,pointer.y);
    if(travel<16) undoLast();                    // quick tap on the corner = undo
    else if(corner.peel>=0.5) turnPage(1);        // dragged the corner enough = turn to a fresh page
    corner=null; return; }
  if(grabbed){ const sp=Math.hypot(grabbed.vx,grabbed.vy);
    if(sp>10){ if(grabbed.soul){grabbed.soul.state="idle"; reactAt(grabbed,"ex"); grabbed.dizzy=1;} }        // flung -> dizzy
    else if(grabbed.soul){ grabbed.sq=0.5; grabbed.vy=-2.6; grabbed.soul.mood=0.8; grabbed.soul.state="idle"; reactAt(grabbed,pick(["spark","note","heart"])); sPoke(); } // tapped -> startled giggle
    grabbed=null; return; }
  if(drawing){ // finalize + remember shape for the mimic
    const hadLen=drawing.raw.length; endStroke();
    const last=strokes[strokes.length-1]; if(last&&last.author===0){ lastPlayerShape=last.pts.slice(); }
  }
});
cv.addEventListener("pointercancel",()=>{ pointer.down=false; grabbed=null; drawing=null; });
const getCo = ("getCoalescedEvents" in PointerEvent.prototype) ? PointerEvent.prototype.getCoalescedEvents : null;

function hitTray(x,y){
  for(const d of tray.dots){ if(dist(x,y,d.x,d.y)<Math.max(16,d.r+6)){ color=d.c; tool="pen"; L.color=color; saveLedger(); tone(500,.05,.04,"sine"); return true; } }
  const e=tray.eraser; if(dist(x,y,e.x,e.y)<20){ tool="eraser"; tone(240,.05,.04,"sine"); return true; }
  return false;
}
function creatureAt(x,y){ let best=null,bd=1e9; for(const s of strokes){ if(!s.alive||s.pending)continue; const cx=s.x+s.bb.w/2,cy=s.y+s.bb.h/2; const r=Math.max(24,Math.max(ew(s),eh(s))*0.6); const d=dist(x,y,cx,cy); if(d<r&&d<bd){bd=d;best=s;} } return best; }
function eraseAt(x,y){
  for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; const cx=s.x+s.bb.w/2,cy=s.y+s.bb.h/2; const r=Math.max(20,Math.max(ew(s),eh(s))*0.5);
    if(dist(x,y,cx,cy)<r){
      if(s.alive && s.soul && s.soul.state==="flee"){ L.erasedAlive++; } // only fleeing-alive counts
      reactAt(s,"dust"); sErase(); strokes.splice(i,1); saveLedger(); return;
    }
  }
}
function undoLast(){ for(let i=strokes.length-1;i>=0;i--){ if(strokes[i].author===0){ reactAt(strokes[i],"dust"); strokes.splice(i,1); return; } } }

/* ===================================================================
   MAIN LOOP
   =================================================================== */
let last=performance.now(), running=true;
function loop(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  if(running){ step(dt); render(); }
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",()=>{ running=!document.hidden; last=performance.now(); if(document.hidden){ saveLedger(); saveBook(); } });
